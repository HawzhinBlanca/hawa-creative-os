rules:
- id: e1000000-0000-4000-8000-000000000001
  key: legal_authority_citation
  category: compliance
  scope: client
  humanRule: All formal proclamations and public reports must cite statutory authorization
    under Kurdistan Regional Law No. 6 of 2022.
  machineRule:
    patternRequired: Law No\. (?:6|٦) of 2022|یاسای ژمارە (?:6|٦)ی ساڵی 2022|القانون
      رقم (?:6|٦) لسنة 2022
  priority: 100
  effectiveFrom: '2022-08-04T00:00:00Z'
  effectiveUntil: null
  status: active
- id: e1000000-0000-4000-8000-000000000002
  key: logo_contrast_safety
  category: design
  scope: client
  humanRule: Official KAAE emblems must maintain at least 4.5:1 contrast against adjacent
    background colors.
  machineRule:
    minContrastRatio: 4.5
  priority: 90
  effectiveFrom: '2022-08-04T00:00:00Z'
  effectiveUntil: null
  status: active
- id: e1000000-0000-4000-8000-000000000003
  key: logo_distortion_prohibition
  category: design
  scope: client
  humanRule: Official KAAE emblems must never be stretched, distorted, rotated diagonally,
    or recolored.
  machineRule:
    allowDistortion: false
    allowRotation: false
    allowRecoloring: false
  priority: 95
  effectiveFrom: '2022-08-04T00:00:00Z'
  effectiveUntil: null
