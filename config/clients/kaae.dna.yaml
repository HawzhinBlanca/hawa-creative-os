  layoutRules:
  - Maintain official logo clear space invariant equal to or greater than the cap-height
    of letter K (28px minimum).
  - Enforce strict RTL (Right-to-Left) directional orientation for Kurdish Sorani
    and Arabic publications.
  - Preserve bidirectional text flow; verify zero character reversal on Western Arabic
    / Indic numerals in legal citations.
  - Do not stretch, distort, or change the aspect ratio or proportions of the emblem.
  - Do not rotate, angle, or place the emblem diagonally.
  - Do not alter the colors of the emblem rays, central K, or circular banner.
  - Prohibit placing official lockup logos directly on noisy or low-contrast backgrounds
    without a minimum 4.5:1 contrast container.
  - Headings in Minion Variable Bold (20-30pt Title Case or Small Caps), Subheadings
    in Medium or Italic (16-20pt), Body in Regular (11-12pt, 1.4x line spacing).
  - 'Stationery: Business cards require logo, name, title, contact info. Letterheads
    require top logo and footer contact. Certificates require logo, recipient name,
    seal, date. Email signatures include name, title, KAAE affiliation, phone, email,
    website, and social links.'
  imageryRules:
  - Feature authentic photography of students, classrooms, laboratories, and peer
    review committees across Kurdistan.
  - Avoid generic, Western corporate stock imagery that lacks local institutional
    context.
  - Editorial and event banners must feature high-resolution institutional photography
    with KAAE branded watermark in top-right or top-left corner conforming to layout
    direction.
