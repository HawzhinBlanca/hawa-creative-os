  layoutRules:
  - Logo clear space on every side equals the height of the "K" in the logo (KAAE_Guidelines4.pdf
    p.4).
  - 'Logo minimum width: 80px digital, 20mm print; favicon 16px with the simplified mark only
    (p.4).'
  - Enforce strict RTL (Right-to-Left) directional orientation for Kurdish Sorani and Arabic
    publications.
  - Preserve bidirectional text flow; verify zero character reversal on Western Arabic / Indic
    numerals in legal citations.
  - Never stretch or distort the logo, rotate or tilt it, or add effects or shadows (p.5).
  - Never change the approved logo colours or its typeface, and never place it on a busy background
    (p.6).
  - Always use the original logo files from the brand team (p.6).
  - 'Light first: white pages with generous margins; KAAE Blue (#4770A3) titles, leads, labels
    and brand cards; KAAE Gold (#F7B500) title bar and accents; Midnight (#0A1628) body text
    (pp.7-8).'
  - 'Typography: titles in Crimson Pro Bold in KAAE Blue; leads in Inter Italic in KAAE Blue;
    body in Inter in Midnight; Sorani and Arabic in sans, right-aligned: IBM Plex Sans Arabic
    or Noto Sans Arabic titles, Noto Sans Arabic body (p.10).'
  - 'Page grammar: logo top-left; letter-spaced KAAE Blue section label top-right over a thin
    grey rule with a gold gradient segment at its left; serif KAAE Blue title with a short Gold
    to Sun bar; italic KAAE Blue lead; Inter body; rounded cards (white with a soft shadow,
    KAAE Blue with white text and a Sun card title, or cream with a gold left edge); stat cards
    with big serif numbers; KAAE Blue to Gold gradient rule at the foot.'
  - 'Covers: navy gradient from KAAE Blue at the top left to Midnight, centred logo, white serif
    title, short gold bar, gold letter-spaced subtitle (p.7).'
  - 'Elements (p.13): quarter-disc sunburst with five rays and a triangle mosaic pattern fading
    upward, subtle, never over copy or the logo''s clear space.'
  - 'Stationery (p.11): business cards carry the logo, name, title and contact details in the
    guideline''s palette and type. Letterheads require top logo and footer contact. Certificates
    require logo, recipient name, seal, date. Email signatures include name, title, KAAE affiliation,
    phone, email, website, and social links.'
  imageryRules:
  - Feature authentic photography of students, classrooms, laboratories, and peer
    review committees across Kurdistan.
  - Avoid generic, Western corporate stock imagery that lacks local institutional
    context.
  - Editorial and event banners must feature high-resolution institutional photography
    with KAAE branded watermark in top-right or top-left corner conforming to layout
    direction.
