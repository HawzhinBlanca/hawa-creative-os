name: hawa-production

# Every container rotates its own logs; an unbounded json-file log is a slow disk-full outage.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# One worker definition for both colours; only the colour and its own address differ.
x-worker-environment: &worker-environment
  NODE_ENV: production
  PORT: 9080
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/docker/.env (see infra/docker/.env.example)}
  RESTATE_INGRESS_URL: http://restate:8080
  RESTATE_ADMIN_URL: http://restate:9070
  HAWA_BUILD_COMMIT: ${HAWA_BUILD_COMMIT:-unknown}
  # The content-addressed file store (ADR-035), the same host directory as Core's.
  HAWA_BLOB_DIR: /var/lib/hawa/blobs
  # Who asks Telegram for updates (Phase 2.1, ADR-034; ADR-135): the worker, set once in
  # infra/docker/.env for Core and both colours alike; deploy.sh refuses any other value. The live
  # colour polls and hands each update to its chat's ChatInbox, calling Core's /v1/internal/* with
  # HAWA_WORKER_TOKEN, which comes from .env.production (env_file) like every credential; without it
  # the poller does not start.
  HAWA_TELEGRAM_POLLER: ${HAWA_TELEGRAM_POLLER:-worker}

x-worker: &worker
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.worker
    args:
      HAWA_BUILD_COMMIT: ${HAWA_BUILD_COMMIT:-unknown}
  profiles: ["worker"]
  restart: unless-stopped
  logging: *logging
  env_file:
    - .env.production
  networks:
    - core
    - egress
  # Both colours write to the file store (ADR-035): Telegram intake, and with it the photo puts, moves
  # into the worker in Phase 2.1. deploy.sh creates the directory and its marker before any container.
  volumes:
    - ${HAWA_BLOBS_DIR:-${HOME}/.hawa/blobs}:/var/lib/hawa/blobs
  # The same Telegram address Core pins. The worker polls Telegram and sends every requester message
  # since ADR-129/135; on 2026-09-29 the office network could not reach the address DNS returned
  # (149.154.166.110), so the worker could neither receive nor send while Core, pinned, still could.
  extra_hosts:
    - "api.telegram.org:149.154.167.99"
  depends_on:
    core:
      condition: service_healthy
    restate:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:9080/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  nginx:
    image: nginx:1.27-alpine-slim
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HAWA_BIND_IP:-127.0.0.1}:${HAWA_PORT:-8080}:80"
    volumes:
      # Files from the repository are bound through ~/.hawa/current, the release production runs
      # (ADR-158), never through the directory compose was started from: the path stays the same from
      # one deploy to the next, so a deploy does not recreate a container only because its release
      # directory changed, and no bind mount points into a checkout people work in. deploy.sh sets
      # HAWA_RELEASE_ROOT to the new release for its one-off nginx -t and vector validate runs.
      - ${HAWA_RELEASE_ROOT:-${HOME}/.hawa/current}/infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # The file store, read-only, for the internal /_blobs/ location that Core's X-Accel-Redirect
      # answers point at (ADR-035). Files are 0444 and directories 0755, so nginx's user can read them.
      - ${HAWA_BLOBS_DIR:-${HOME}/.hawa/blobs}:/srv/hawa-blobs:ro
    networks:
      - edge
      - core
    depends_on:
      core:
        condition: service_healthy
      desk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

  desk:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.desk
      args:
        HAWA_BUILD_COMMIT: ${HAWA_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    logging: *logging
    networks:
      - core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

  core:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.core
      args:
        HAWA_BUILD_COMMIT: ${HAWA_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env.production
    environment:
      # Credentials and office policy (DATABASE_URL, TELEGRAM_WEBHOOK_SECRET,
      # TELEGRAM_ALLOWED_USERS, TELEGRAM_INTAKE_ALLOWED_USERS …) come only from .env.production.
      # No default value here may ever be usable in production.
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/docker/.env (see infra/docker/.env.example)}
      RESTATE_INGRESS_URL: http://restate:8080
      HAWA_AVAILABILITY_WORKER_URLS: http://worker-blue:9080/health,http://worker-green:9080/health
      HAWA_BUILD_COMMIT: ${HAWA_BUILD_COMMIT:-unknown}
      # People cut out of client photos (ADR-032). Optional: without it a photo is placed framed.
      CUTOUT_URL: http://cutout:8090
      # The content-addressed file store (ADR-035): Core writes it and answers file requests with an
      # X-Accel-Redirect to nginx's internal location under this prefix.
      HAWA_BLOB_DIR: /var/lib/hawa/blobs
      HAWA_BLOB_ACCEL_PREFIX: /_blobs/
      # Only `worker` is accepted since ADR-135 (deploy.sh refuses anything else): Core never polls and
      # serves the worker's intake calls on /v1/internal/*, which take HAWA_WORKER_TOKEN (.env.production) only.
      HAWA_TELEGRAM_POLLER: ${HAWA_TELEGRAM_POLLER:-worker}
    volumes:
      - ${HAWA_BLOBS_DIR:-${HOME}/.hawa/blobs}:/var/lib/hawa/blobs
    extra_hosts:
      - "api.telegram.org:149.154.167.99"
    networks:
      - core
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      restate:
        condition: service_healthy
    healthcheck:
      # /ready: process up and one database ping. /health calls Restate, Canva, Telegram and the cut-out
      # service; polled every 10 s it was load, and a slow dependency made the container "unhealthy".
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/ready').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The worker runs as two colours, blue and green, each registered with Restate at its own address
  # (architecture programme 0.1, ADR-034). Restate pins every invocation to the deployment (address)
  # that started it, so a deploy starts and registers the colour that is not live and leaves the live
  # one running until nothing is pinned to it; replacing the container behind one address replayed
  # journals in flight on new code (RT0016). Only deploy.sh starts a colour: the `worker` profile keeps
  # a plain `compose up` (the deploy's own, the watchdog's) from creating or recreating either.
  # The outbox consumer runs only in the colour Restate sends new work to (apps/worker/src/live-colour.ts).
  worker-blue:
    <<: *worker
    environment:
      <<: *worker-environment
      HAWA_WORKER_COLOUR: blue
      HAWA_WORKER_SELF_URI: http://worker-blue:9080

  worker-green:
    <<: *worker
    environment:
      <<: *worker-environment
      HAWA_WORKER_COLOUR: green
      HAWA_WORKER_SELF_URI: http://worker-green:9080

  # Person cut-outs (ADR-032): a matting model and a face detector on the internal network only.
  # The model files are mounted read-only from the host and pinned by sha256; one cut takes about
  # 8 GB at its peak, so the service has its own limit and a spike cannot take Core down with it.
  cutout:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.cutout
    image: hawa-cutout:1
    restart: unless-stopped
    logging: *logging
    environment:
      CUTOUT_MODEL: /models/BiRefNet-portrait-epoch_150.onnx
      CUTOUT_MODEL_SHA256: 1ba1c8ff5a7bbfadc8d8d13fb11d7be793f91f23d9d466549e37a854f6668f99
      CUTOUT_FACE_MODEL: /models/face_detection_yunet_2023mar.onnx
      CUTOUT_THREADS: "4"
    volumes:
      - ${HAWA_MODELS_DIR:-${HOME}/.hawa/models}:/models:ro
      # No file store mount in 3.1 (ADR-035): the service receives the upright photo's bytes, a derived
      # picture that is not a blob, and Core stores the cut-outs it returns. If upright variants ever
      # become blobs, mount the store read-only and accept {"blob":"<sha>.<ext>"} requests:
      # - ${HAWA_BLOBS_DIR:-${HOME}/.hawa/blobs}:/blobs:ro
    mem_limit: 12g
    networks:
      - core

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hawa}
      POSTGRES_USER: ${POSTGRES_USER:-hawa_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/docker/.env (see infra/docker/.env.example)}
      # On an empty data directory 00-init-roles.sql creates hawa_app and the login role this URL names
      # (hawa_app_a/_b, infra/ops/README.md) with the password core connects with.
      HAWA_APP_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/docker/.env (see infra/docker/.env.example)}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:54332:5432"
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      # Crash recovery first syncs the whole data directory. File by file (fsync, the default) it took
      # over a minute on 2026-09-29 and 2026-09-30 while the Docker VM was swapping, and every client
      # was refused "the database system is in recovery mode" meanwhile. syncfs syncs the file system
      # once (Linux; the container is Linux on every host). ADR-158.
      - -c
      - recovery_init_sync_method=syncfs
    # The test and chaos stacks share this Docker VM. Their Postgres, Restate, Core and workers now have
    # memory and CPU limits (docker-compose.test.yml, packages/testkit/chaos/docker-compose.chaos.yml),
    # and this reservation (cgroup memory.low) keeps production's buffers from being reclaimed first
    # when the VM runs short: on 2026-09-30 it swapped 14.5 of 15 GB and Postgres crashed. ADR-158.
    mem_reservation: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Through ~/.hawa/current, like nginx.conf (ADR-158); read only when the data directory is empty.
      - ${HAWA_RELEASE_ROOT:-${HOME}/.hawa/current}/infra/docker/00-init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
      - ${HAWA_RELEASE_ROOT:-${HOME}/.hawa/current}/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ${HAWA_RELEASE_ROOT:-${HOME}/.hawa/current}/db/rls.sql:/docker-entrypoint-initdb.d/02-rls.sql:ro
      - ${HAWA_RELEASE_ROOT:-${HOME}/.hawa/current}/db/03-grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
      - ${HAWA_RELEASE_ROOT:-${HOME}/.hawa/current}/db/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    networks:
      - core
      - edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hawa_owner} -d ${POSTGRES_DB:-hawa}"]
      interval: 10s
      timeout: 5s
      retries: 10

  restate:
    # 1.7.10 (2026-09-14): patch releases of 1.7 (VQueue, RocksDB and HTTP/2 fixes). Its opt-in
    # migrations (VQueues, preflight retention, obsolete-VQueue cleanup) are one-way and stay off, so
    # rolling back to 1.7.0 stays possible (infra/docker/README.md). A minor upgrade (1.8) migrates
    # partitions one way: test it on a copy of restate_data first (ADR-034).
    image: ghcr.io/restatedev/restate:1.7.10
    restart: unless-stopped
    logging: *logging
    environment:
      RESTATE_NODE_NAME: hawa-restate-prod-1
    volumes:
      - restate_data:/restate-data
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9070/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Container logs to daily files on the host (architecture programme 1.4, infra/docker/vector.yaml),
  # so the lines of a container a deploy replaced can still be read (scripts/request_logs.ts). It
  # reads the logs through the Docker socket, which is the Docker API: read-only on the file, not on
  # what the API allows, so this image is pinned by digest and the container has no network.
  # 192 MB: it used about 64 MB idle and 118 MB while writing a burst of 20 000 lines in a test.
  vector:
    image: timberio/vector:0.58.0-alpine@sha256:5dcf67db0ee378caa87f3395cb9484ebe3e97bb0334d119f2ac33116e00c5773
    restart: unless-stopped
    logging: *logging
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ${HAWA_RELEASE_ROOT:-${HOME}/.hawa/current}/infra/docker/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HAWA_CONTAINER_LOGS_DIR:-${HOME}/.hawa/logs/containers}:/logs
    network_mode: none
    mem_limit: 192m

networks:
  edge: {}
  egress: {}
  core:
    internal: true

volumes:
  postgres_data:
    name: hawa-production_postgres_data
    external: true
  restate_data:
    name: hawa-production_restate_data
    external: true
