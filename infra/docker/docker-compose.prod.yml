name: hawa-production

# Every container rotates its own logs; an unbounded json-file log is a slow disk-full outage.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# One worker definition for both colours; only the colour and its own address differ.
x-worker-environment: &worker-environment
  NODE_ENV: production
  PORT: 9080
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/docker/.env (see infra/docker/.env.example)}
  RESTATE_INGRESS_URL: http://restate:8080
  RESTATE_ADMIN_URL: http://restate:9070
  HAWA_BUILD_COMMIT: ${HAWA_BUILD_COMMIT:-unknown}

x-worker: &worker
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.worker
  profiles: ["worker"]
  restart: unless-stopped
  logging: *logging
  env_file:
    - .env.production
  networks:
    - core
    - egress
  depends_on:
    core:
      condition: service_healthy
    restate:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:9080/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  nginx:
    image: nginx:1.27-alpine-slim
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HAWA_BIND_IP:-127.0.0.1}:${HAWA_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
      - core
    depends_on:
      core:
        condition: service_healthy
      desk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

  desk:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.desk
    restart: unless-stopped
    logging: *logging
    networks:
      - core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

  core:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.core
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env.production
    environment:
      # Credentials and office policy (DATABASE_URL, TELEGRAM_WEBHOOK_SECRET,
      # TELEGRAM_ALLOWED_USERS, TELEGRAM_INTAKE_ALLOWED_USERS …) come only from .env.production.
      # No default value here may ever be usable in production.
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/docker/.env (see infra/docker/.env.example)}
      RESTATE_INGRESS_URL: http://restate:8080
      HAWA_BUILD_COMMIT: ${HAWA_BUILD_COMMIT:-unknown}
      # People cut out of client photos (ADR-032). Optional: without it a photo is placed framed.
      CUTOUT_URL: http://cutout:8090
    extra_hosts:
      - "api.telegram.org:149.154.167.99"
    networks:
      - core
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      restate:
        condition: service_healthy
    healthcheck:
      # /ready: process up and one database ping. /health calls Restate, Canva, Telegram and the cut-out
      # service; polled every 10 s it was load, and a slow dependency made the container "unhealthy".
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/ready').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The worker runs as two colours, blue and green, each registered with Restate at its own address
  # (architecture programme 0.1, ADR-034). Restate pins every invocation to the deployment (address)
  # that started it, so a deploy starts and registers the colour that is not live and leaves the live
  # one running until nothing is pinned to it; replacing the container behind one address replayed
  # journals in flight on new code (RT0016). Only deploy.sh starts a colour: the `worker` profile keeps
  # a plain `compose up` (the deploy's own, the watchdog's) from creating or recreating either.
  # The outbox consumer runs only in the colour Restate sends new work to (apps/worker/src/live-colour.ts).
  worker-blue:
    <<: *worker
    environment:
      <<: *worker-environment
      HAWA_WORKER_COLOUR: blue
      HAWA_WORKER_SELF_URI: http://worker-blue:9080

  worker-green:
    <<: *worker
    environment:
      <<: *worker-environment
      HAWA_WORKER_COLOUR: green
      HAWA_WORKER_SELF_URI: http://worker-green:9080

  # Person cut-outs (ADR-032): a matting model and a face detector on the internal network only.
  # The model files are mounted read-only from the host and pinned by sha256; one cut takes about
  # 8 GB at its peak, so the service has its own limit and a spike cannot take Core down with it.
  cutout:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.cutout
    image: hawa-cutout:1
    restart: unless-stopped
    logging: *logging
    environment:
      CUTOUT_MODEL: /models/BiRefNet-portrait-epoch_150.onnx
      CUTOUT_MODEL_SHA256: 1ba1c8ff5a7bbfadc8d8d13fb11d7be793f91f23d9d466549e37a854f6668f99
      CUTOUT_FACE_MODEL: /models/face_detection_yunet_2023mar.onnx
      CUTOUT_THREADS: "4"
    volumes:
      - ${HAWA_MODELS_DIR:-${HOME}/.hawa/models}:/models:ro
    mem_limit: 12g
    networks:
      - core

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hawa}
      POSTGRES_USER: ${POSTGRES_USER:-hawa_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/docker/.env (see infra/docker/.env.example)}
      # 00-init-roles.sql creates hawa_app on an empty data directory with the password core connects with.
      HAWA_APP_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/docker/.env (see infra/docker/.env.example)}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:54332:5432"
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./00-init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
      - ../../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../db/rls.sql:/docker-entrypoint-initdb.d/02-rls.sql:ro
      - ../../db/03-grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
      - ../../db/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    networks:
      - core
      - edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hawa_owner} -d ${POSTGRES_DB:-hawa}"]
      interval: 10s
      timeout: 5s
      retries: 10

  restate:
    # 1.7.10 (2026-09-14): patch releases of 1.7 (VQueue, RocksDB and HTTP/2 fixes). Its optional
    # obsolete-VQueue cleanup is one-way; it stays off. A minor upgrade (1.8) migrates partitions one way:
    # test it on a copy of restate_data first (ADR-034).
    image: ghcr.io/restatedev/restate:1.7.10
    restart: unless-stopped
    logging: *logging
    environment:
      RESTATE_NODE_NAME: hawa-restate-prod-1
    volumes:
      - restate_data:/restate-data
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9070/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  edge: {}
  egress: {}
  core:
    internal: true

volumes:
  postgres_data:
    name: hawa-production_postgres_data
    external: true
  restate_data:
    name: hawa-production_restate_data
    external: true
