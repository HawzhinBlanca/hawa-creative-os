user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # A comparison judge's link carries its token in the path (/judge/<token>), and the Desk's event
    # stream its session token in the query (?access_token=, since EventSource cannot send a header):
    # the access log writes both as *** so nobody reading the log can act as a judge or an office
    # member (2026-09-24 reviews). Otherwise the stock "combined" format.
    map $request_uri $judge_masked_uri {
        "~^(?<judge_before>.*/judge/)[^/?]+(?<judge_after>.*)$" "${judge_before}***${judge_after}";
        default $request_uri;
    }
    map $judge_masked_uri $loggable_request_uri {
        "~^(?<token_before>.*[?&]access_token=)[^&]*(?<token_after>.*)$" "${token_before}***${token_after}";
        default $judge_masked_uri;
    }
    # Every request has one id (architecture programme 1.4): the caller's X-Request-Id when it is a
    # plain token (the shape Core accepts, apps/core/src/logging.ts), otherwise one nginx makes. It is
    # passed to Core, which logs every line of the request under it and sends it back, and written
    # here as rid=, so scripts/request_logs.ts finds this line with Core's and the worker's.
    map $http_x_request_id $hawa_request_id {
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
        default $request_id;
    }
    log_format hawa_combined '$remote_addr - $remote_user [$time_local] "$request_method $loggable_request_uri $server_protocol" '
                             '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time '
                             'rid=$hawa_request_id';
    access_log /var/log/nginx/access.log hawa_combined;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (DDoS & Abuse Mitigation)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    # Upstream Services (Internal Docker Core Network)
    upstream core_api {
        server core:3001;
        keepalive 32;
    }

    upstream desk_pwa {
        server desk:80;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Client body size limits (for asset uploads)
        client_max_body_size 25M;

        # OWASP Secure Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Real-time Server-Sent Events (SSE) Stream (Zero Buffering)
        location ~ ^/(v1|api/v1)/events/stream$ {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # The error log writes the whole request line, token included, and cannot mask it: an
            # upstream error here (every Core restart drops the streams) is not written (crit only).
            error_log /var/log/nginx/error.log crit;
        }

        # Session issue: credentials are long random keys, and the bind is loopback, but a login
        # endpoint still gets its own slow lane so a mistaken script cannot hammer it.
        location = /v1/auth/session {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API Routes
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # Webhook Ingress (Strict Rate Limits)
        location /api/webhooks/ {
            limit_req zone=webhook_limit burst=10 nodelay;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # A comparison judge's page and picks: the token is in the path, which the error log would write
        # in full with every upstream or rate-limit error, so only critical errors are written here.
        location /api/judge/ {
            limit_req zone=api_limit burst=20 nodelay;
            error_log /var/log/nginx/error.log crit;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API Fallback
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Retired embedded studio cannot serve an alternative editor.
        location = /studio {
            default_type application/json;
            return 410 '{"error":"STUDIO_ARCHIVED","activeStudio":"canva"}';
        }
        location /studio/ {
            default_type application/json;
            return 410 '{"error":"STUDIO_ARCHIVED","activeStudio":"canva"}';
        }

        # Canonical Hawa Desk PWA Frontend
        location / {
            proxy_pass http://desk_pwa;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
