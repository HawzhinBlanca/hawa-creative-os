user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # A comparison judge's link carries its token in the path (/judge/<token>), and the Desk's event
    # stream a one-use ticket (?ticket=, ADR-037; it replaced the session token there). Core no longer
    # accepts ?access_token= (ADR-128), but an old link or cached Desk may still send one. The access
    # log writes each as *** so nobody reading the log can act as a judge or an office member
    # (2026-09-24 reviews). Otherwise the stock "combined" format.
    map $request_uri $judge_masked_uri {
        "~^(?<judge_before>.*/judge/)[^/?]+(?<judge_after>.*)$" "${judge_before}***${judge_after}";
        default $request_uri;
    }
    map $judge_masked_uri $loggable_request_uri {
        "~^(?<token_before>.*[?&](?:access_token|ticket)=)[^&]*(?<token_after>.*)$" "${token_before}***${token_after}";
        default $judge_masked_uri;
    }
    # A judge page's own requests send it as the Referer (same origin, so the full URL): masked too.
    map $http_referer $loggable_referer {
        "~^(?<referer_before>.*/judge/)[^/?]+(?<referer_after>.*)$" "${referer_before}***${referer_after}";
        default $http_referer;
    }
    # Every request has one id (architecture programme 1.4): the caller's X-Request-Id when it is a
    # plain token (the shape Core accepts, apps/core/src/logging.ts), otherwise one nginx makes. It is
    # passed to Core, which logs every line of the request under it and sends it back, and written
    # here as rid=, so scripts/request_logs.ts finds this line with Core's and the worker's.
    map $http_x_request_id $hawa_request_id {
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
        default $request_id;
    }
    # Preserve the browser authority, including a non-default port. $host strips
    # that port, causing otherwise valid cookie/CSRF requests to fail at Core.
    map $http_host $hawa_forwarded_host {
        default $http_host;
        "" $host;
    }
    log_format hawa_combined '$remote_addr - $remote_user [$time_local] "$request_method $loggable_request_uri $server_protocol" '
                             '$status $body_bytes_sent "$loggable_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time '
                             'rid=$hawa_request_id';
    access_log /var/log/nginx/access.log hawa_combined;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate limits (ADR-158). Behind Docker's port forwarding every caller arrives from the same address
    # (172.21.0.1 on the office Mac), so zones keyed on the address were one bucket for the whole
    # office, sign-in included at 10 a minute, and a refusal was a 503 that read as an outage. A caller
    # is now told apart by its session cookie, else its Authorization header, else its address; the
    # value is only a key in nginx's shared memory and is never logged. A caller could rotate those
    # headers for a fresh bucket, so a second zone per address caps everyone together, well above what
    # the office sends. A refusal is 429 Too Many Requests.
    map $http_authorization $hawa_rate_auth {
        "" "";
        default "a:$http_authorization";
    }
    map $cookie_hawa_session $hawa_rate_session {
        "" $hawa_rate_auth;
        default "s:$cookie_hawa_session";
    }
    map $hawa_rate_session $hawa_rate_key {
        "" $binary_remote_addr;
        default $hawa_rate_session;
    }
    limit_req_status 429;
    limit_req_zone $hawa_rate_key zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_edge:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;
    limit_req_zone $hawa_rate_key zone=login_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login_edge:10m rate=120r/m;

    # The customer API's public listener (ADR-294) proxies a request only when the path exactly as the
    # browser sent it ($request_uri, which proxy_pass forwards unchanged) is plain segments under
    # /v1/customer/: letters, digits, _ and -, no dot, no escape, no empty segment. nginx matches
    # locations on the decoded, dot-merged $uri, so without this /v1/customer/%2e%2e/tasks would match
    # the customer location here and reach Core as a different path. Every customer route is made of
    # such segments (ids are UUIDs, formats are png/pptx); the query string is checked separately.
    map $request_uri $hawa_customer_uri_ok {
        "~^/v1/customer(?:/[A-Za-z0-9_-]+)+(?:\?[A-Za-z0-9_=&%.~-]*)?$" 1;
        default 0;
    }

    # Docker replaces service addresses during deployments. Refresh DNS without a proxy restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # Upstream Services (Internal Docker Core Network)
    upstream core_api {
        zone core_api 64k;
        server core:3001 resolve;
        keepalive 32;
    }

    upstream desk_pwa {
        zone desk_pwa 64k;
        server desk:80 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Client body size limits (for asset uploads)
        client_max_body_size 25M;

        # OWASP Secure Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # The worker's own API (/v1/internal/*, ADR-128): the worker calls Core directly on the compose
        # network (HAWA_CORE_INTERNAL_URL, http://core:3001), never through nginx, so nothing from
        # outside may reach it. The pattern is Core's isInternalPath, under each prefix Core mounts.
        # A regular expression is matched before the /v1/ and /api/ prefixes, and ahead of the stream.
        location ~ ^/(?:api/)?(?:v1/)?internal(?:/|$) {
            return 404;
        }

        # Core's health, under each prefix Core mounts it, is never rate limited (ADR-158): the watchdog
        # and deploy.sh ask for it, and a refused probe read as an outage.
        location ~ ^/(?:api/v1|v1|api)/health$ {
            include /etc/nginx/hawa-office-proof.conf;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $hawa_forwarded_host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-time Server-Sent Events (SSE) Stream (Zero Buffering)
        location ~ ^/(v1|api/v1)/events/stream$ {
            include /etc/nginx/hawa-office-proof.conf;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $hawa_forwarded_host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # The error log writes the whole request line, token included, and cannot mask it: an
            # upstream error here (every Core restart drops the streams) is not written (crit only).
            error_log /var/log/nginx/error.log crit;
        }

        # Session issue: credentials are long random keys, and the bind is loopback, but a login
        # endpoint still gets its own slow lane so a mistaken script cannot hammer it: 30 a minute per
        # caller (the Desk asks it on every load), 120 a minute for everyone from one address.
        location = /v1/auth/session {
            limit_req zone=login_limit burst=20 nodelay;
            limit_req zone=login_edge burst=60 nodelay;
            include /etc/nginx/hawa-office-proof.conf;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $hawa_forwarded_host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API Routes
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req zone=api_edge burst=200 nodelay;
            include /etc/nginx/hawa-office-proof.conf;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $hawa_forwarded_host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # Webhook Ingress (Strict Rate Limits)
        location /api/webhooks/ {
            limit_req zone=webhook_limit burst=10 nodelay;
            include /etc/nginx/hawa-office-proof.conf;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $hawa_forwarded_host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # A comparison judge's page and picks: the token is in the path, which the error log would write
        # in full with every upstream or rate-limit error, so only critical errors are written here.
        location /api/judge/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req zone=api_edge burst=200 nodelay;
            error_log /var/log/nginx/error.log crit;
            include /etc/nginx/hawa-office-proof.conf;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $hawa_forwarded_host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API Fallback
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req zone=api_edge burst=200 nodelay;
            include /etc/nginx/hawa-office-proof.conf;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $hawa_forwarded_host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The content-addressed file store (ADR-035), internal only: a request from outside gets 404.
        # Core authorises a file request on its referencing row, never on the hash, and answers with
        # X-Accel-Redirect to this location; nginx then sends the file, keeping Core's Content-Type,
        # Content-Disposition and Cache-Control. The alias is the read-only mount in
        # docker-compose.prod.yml (/srv/hawa-blobs).
        location /_blobs/ {
            internal;
            alias /srv/hawa-blobs/;
            sendfile on;
            # A missing file was logged at error level with the original request line, whose query
            # string the error log cannot mask (ADR-128). It is answered 404 without a log line.
            log_not_found off;
            error_log /var/log/nginx/error.log crit;
            # add_header here replaces the server-level set above, so those are repeated.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # A stored file is data, never a page: nothing in it may run or load anything.
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            # Empty, and so omitted, when Core leaves it out (a judge's link keeps the arms blinded).
            add_header X-Content-SHA256 $upstream_http_x_content_sha256 always;
        }

        # Retired embedded studio cannot serve an alternative editor.
        location = /studio {
            default_type application/json;
            return 410 '{"error":"STUDIO_ARCHIVED","activeStudio":"canva"}';
        }
        location /studio/ {
            default_type application/json;
            return 410 '{"error":"STUDIO_ARCHIVED","activeStudio":"canva"}';
        }

        # Canonical Hawa Desk PWA Frontend
        location / {
            proxy_pass http://desk_pwa;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $hawa_forwarded_host;
            proxy_set_header X-Request-Id $hawa_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---------------------------------------------------------------------------------------------
    # Public listeners (ADR-294). The office Mac runs cloudflared (infra/cloudflared), which receives
    # https://design-api.hawzhin.app and https://desk.hawzhin.app from Cloudflare and sends them here,
    # to two ports compose publishes on the host's 127.0.0.1 only. The office listener above (port 80,
    # published as 127.0.0.1:8080) is untouched and never reachable through the tunnel.
    #
    # Both public listeners:
    # - answer only their own host name; any other Host gets 404 (the default_server blocks), so the
    #   office Host (127.0.0.1:8080, what trusted-office access checks) is never forwarded from them;
    # - take the caller's address from CF-Connecting-IP, trusting it only from the addresses a
    #   connection to a loopback-published port arrives from inside the container (the Docker gateway;
    #   on the office Mac 172.21.0.1, see the rate-limit note above), so the per-address zones
    #   (api_edge, login_edge) count each customer separately instead of the whole internet as one;
    # - never include the office proof, and set X-Hawa-Public-Gateway, which makes Core refuse
    #   trusted-office access outright (apps/core/src/services/office-access.ts), whatever else is sent;
    # - remove the forwarding and office headers a caller could send (X-Forwarded-*, Forwarded,
    #   X-Real-IP, X-Hawa-Office-*, the worker's X-Hawa-Lifecycle-*, test-only role headers) and set
    #   X-Real-IP, X-Forwarded-For and X-Forwarded-Proto themselves.
    # They are usable only with HAWA_DESK_AUTH_MODE=required (runbooks/GO_LIVE_WEBSITE.md).
    # ---------------------------------------------------------------------------------------------

    server {
        listen 8081 default_server;
        server_name _;
        access_log /var/log/nginx/access.log hawa_combined;
        return 404;
    }

    # https://design-api.hawzhin.app: the customer API and nothing else. The website (hawzhin.app)
    # calls it from the browser; Core's CORS admits only https://hawzhin.app and https://www.hawzhin.app.
    server {
        listen 8081;
        server_name design-api.hawzhin.app;

        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.65.0/24;
        real_ip_header CF-Connecting-IP;

        # A customer photo is at most 10 MB (CUSTOMER_PHOTO_MAX_BYTES); the rest is headroom.
        # nginx buffers the whole body before Core reads it, so Core's 15 s read bound measures the
        # hop from nginx, not the customer's upload.
        client_max_body_size 12m;
        client_body_timeout 30s;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Only the headers a customer route reads are forwarded (an allowlist, so a header added to
        # the office later can never be sent from here). Content-Length and Transfer-Encoding are
        # nginx's own. No cookie is forwarded: the customer API authenticates only the bearer token.
        proxy_pass_request_headers off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Hawa-Public-Gateway "customer";
        proxy_set_header X-Request-Id $hawa_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Origin $http_origin;
        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
        proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Content-SHA256 $http_x_content_sha256;
        proxy_set_header X-Photo-Filename $http_x_photo_filename;
        proxy_set_header If-Match-Version $http_if_match_version;
        proxy_set_header If-None-Match $http_if_none_match;

        # Exact, or nginx would answer this with a 301 to /v1/customer/ (a prefix location ending in /
        # that proxies redirects its own name without the slash).
        location = /v1/customer {
            return 404;
        }

        location ^~ /v1/customer/ {
            if ($hawa_customer_uri_ok = 0) {
                return 404;
            }
            limit_req zone=api_limit burst=20 nodelay;
            limit_req zone=api_edge burst=200 nodelay;
            proxy_pass http://core_api;
            proxy_read_timeout 60s;
        }

        # Everything else, Core's health, the office API, /api/ and /v1/internal/ included.
        location / {
            return 404;
        }
    }

    server {
        listen 8082 default_server;
        server_name _;
        access_log /var/log/nginx/access.log hawa_combined;
        return 404;
    }

    # https://desk.hawzhin.app: the Desk and its office API, for Google sign-in (an HTTPS origin), with
    # Core in HAWA_DESK_AUTH_MODE=required. Every request must carry an office session; nothing here is
    # trusted for being "in the office". Not served here: /api/ (webhooks, judge links), Core's health
    # under any prefix but the one the Desk reads, and /v1/internal/.
    server {
        listen 8082;
        server_name desk.hawzhin.app;

        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.65.0/24;
        real_ip_header CF-Connecting-IP;

        client_max_body_size 25M;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Inherited by every location below that sets no proxy_set_header of its own (none does).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Hawa-Public-Gateway "desk";
        proxy_set_header X-Request-Id $hawa_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Hawa-Office-Proof "";
        proxy_set_header X-Hawa-Office-Request "";
        proxy_set_header X-Hawa-Probe-Nonce "";
        proxy_set_header X-Hawa-Lifecycle-Proof "";
        proxy_set_header X-Hawa-Lifecycle-Run-Id "";
        proxy_set_header X-Hawa-Lifecycle-Request-Id "";
        proxy_set_header X-Hawa-Desk "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Enforce-Auth "";

        location ~ ^/(?:api/)?(?:v1/)?internal(?:/|$) {
            return 404;
        }

        # The Desk's sidebar asks this for the status light. Limited per caller like the API.
        location = /v1/health {
            limit_req zone=api_edge burst=200 nodelay;
            proxy_pass http://core_api;
        }

        location = /v1/events/stream {
            proxy_pass http://core_api;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            error_log /var/log/nginx/error.log crit;
        }

        location = /v1/auth/session {
            limit_req zone=login_limit burst=20 nodelay;
            limit_req zone=login_edge burst=60 nodelay;
            proxy_pass http://core_api;
        }

        # Google returns the browser here (HAWA_GOOGLE_OIDC_REDIRECT_URI). Core serves the route at the
        # root as well as under /v1/; without this location the Desk's own nginx would answer it.
        location = /auth/google/callback {
            limit_req zone=login_limit burst=20 nodelay;
            limit_req zone=login_edge burst=60 nodelay;
            proxy_pass http://core_api;
        }

        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req zone=api_edge burst=200 nodelay;
            proxy_pass http://core_api;
            proxy_read_timeout 600s;
        }

        location /api/ {
            return 404;
        }

        # As in the office listener: the files Core's X-Accel-Redirect answers point at.
        location /_blobs/ {
            internal;
            alias /srv/hawa-blobs/;
            sendfile on;
            log_not_found off;
            error_log /var/log/nginx/error.log crit;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header X-Content-SHA256 $upstream_http_x_content_sha256 always;
        }

        location = /studio {
            return 404;
        }
        location /studio/ {
            return 404;
        }

        location / {
            proxy_pass http://desk_pwa;
        }
    }
}
