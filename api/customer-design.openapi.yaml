openapi: 3.1.0
info:
  title: Hawzhin workspace customer boundary
  version: 0.1.0
  description: ADR259. RequestLifecycle web generation is not yet admitted; production generation is disabled. Authentication and owned request projection are separate from office authority.
paths:
  /v1/customer/session:
    get:
      security: [{WorkspaceMember: []}]
      responses:
        '200':
          description: Current customer grants and generation readiness; no staff role.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, clients, limits, generationEnabled]
                properties:
                  accountId: {type: string, format: uuid}
                  clients: {type: array, items: {type: object, required: [id, name], properties: {id: {type: string, format: uuid}, name: {type: string}}}}
                  limits: {type: object, properties: {dailyJobs: {type: integer}, concurrentJobs: {type: integer}}}
                  generationEnabled: {type: boolean, description: False until canonical web lifecycle admission is qualified.}
        '401': {description: Workspace sign-in required}
        '403': {description: Member or customer admission denied}
        '503': {description: Identity dependency or durable storage unavailable}
  /v1/customer/jobs:
    get:
      security: [{WorkspaceMember: []}]
      responses:
        '200':
          description: Latest 50 owned jobs; shared-client jobs from other customers are excluded.
          content:
            application/json:
              schema: {type: object, required: [jobs], properties: {jobs: {type: array, items: {$ref: '#/components/schemas/CustomerJob'}}}}
        '401': {description: Workspace sign-in required}
        '403': {description: Current customer admission denied}
        '503': {description: Dependency unavailable}
    post:
      security: [{WorkspaceMember: []}]
      description: Canonical web admission remains disabled in production until the full customer journey is qualified. Stable key and exact body are preserved after uncertain outcomes. Counts and live grants are checked before one atomic immutable web request and outbox commit; RequestLifecycle projects its owned task.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]{8,100}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerDesignRequest'}
      responses:
        '201': {description: New committed job receipt, content: {application/json: {schema: {$ref: '#/components/schemas/JobReceipt'}}}}
        '200': {description: Exact committed replay, content: {application/json: {schema: {$ref: '#/components/schemas/JobReceipt'}}}}
        '400': {description: Invalid or extra fields, or missing stable request key}
        '401': {description: Workspace sign-in required}
        '403': {description: Current customer or brand access denied}
        '409': {description: Differing payload for the same key, or brand DNA unavailable}
        '408': {description: Actual streamed request exceeds the total 10 second deadline; no admission committed}
        '413': {description: Actual streamed request exceeds 49152 bytes}
        '429': {description: Customer request count or concurrency limit reached}
        '503': {description: Generation not admitted or dependency unavailable; preserve the request key}
  /v1/customer/jobs/{id}:
    get:
      security: [{WorkspaceMember: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Owned stable request projection plus latest 100 durable web messages in chronological order; no provider refs or send/read claims, content: {application/json: {schema: {type: object, required: [job, messages, preview, actions], properties: {actions: {$ref: '#/components/schemas/CustomerActions'}, job: {$ref: '#/components/schemas/CustomerJob'}, preview: {anyOf: [{$ref: '#/components/schemas/CapturedPreview'}, {type: 'null'}]}, messages: {type: array, maxItems: 100, items: {type: object, required: [id, kind, text, createdAt, question]}}}}}}}
        '401': {description: Workspace sign-in required}
        '403': {description: Current customer admission denied}
        '404': {description: Job unavailable to this owner, including shared-brand foreign jobs}
        '503': {description: Dependency unavailable}
  /v1/customer/jobs/{id}/actions:
    post:
      security: [{WorkspaceMember: []}]
      description: ADR263. One immutable customer action and outbox command on the current owned request revision. Same-key exact replay precedes stale checks. Serial application uses the existing private RequestLifecycle. Public admission remains disabled. An HTTP receipt is not proof of application or approval.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{8,100}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerAction'}
      responses:
        '202': {description: New queued action, content: {application/json: {schema: {$ref: '#/components/schemas/ActionResponse'}}}}
        '200': {description: Exact retained action replay, content: {application/json: {schema: {$ref: '#/components/schemas/ActionResponse'}}}}
        '400': {description: Invalid or additional fields, missing stable key}
        '401': {description: Workspace sign-in required}
        '403': {description: Current customer or client admission denied}
        '404': {description: Owned request unavailable}
        '408': {description: Streamed JSON exceeds 10 seconds}
        '409': {description: Stale basis or question, wrong stage, unresolved action, or different content for the same key}
        '413': {description: Streamed JSON exceeds 49152 bytes}
        '429': {description: Daily customer generation or action limit reached}
        '503': {description: Generation not ready or dependency unavailable; retain exact key and body}
  /v1/customer/jobs/{id}/review/{captureId}:
    get:
      security: [{WorkspaceMember: []}]
      description: Read-only ADR265 check of the exact owned preview, paired editable PPTX, current QC, source/policy/brand revision and freshly observed native Canva version. Rehashes and parses actual bounded bytes, then rechecks live scope/evidence. No approval, publication, provider URL or office authority. Native version timestamps do not prove absence of same-second edits. At most two complete checks per Core process.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: captureId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 999999999999999}}
        - {name: sha256, in: query, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200': {description: Observed readiness or safe unresolved-check reasons; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/NativeReview'}}}}
        '401': {description: Workspace sign-in required}
        '403': {description: Current customer admission denied}
        '404': {description: Owned job unavailable}
        '409': {description: Stale preview/revision or current review files not ready}
        '503': {description: Check concurrency or service unavailable}
  /v1/customer/jobs/{id}/preview/{captureId}:
    get:
      security: [{WorkspaceMember: []}]
      description: No-store captured native PNG for the live owner/current task/binding/revision/capture/hash. Not approval, final-QA success, or proof of unobserved Canva edits.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: captureId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: sha256, in: query, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200': {description: Bounded verified native PNG, content: {image/png: {schema: {type: string, format: binary}}}}
        '401': {description: Current workspace sign-in required}
        '403': {description: Current admission or origin denied}
        '404': {description: Request not owned or no longer visible}
        '409': {description: Expected capture/revision/hash no longer current}
        '503': {description: Capture integrity or dependency unavailable}
  /v1/customer/clients/{clientId}/photos:
    post:
      security: [{WorkspaceMember: []}]
      parameters:
        - {name: clientId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 100}}
        - {name: X-Content-SHA256, in: header, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
        - {name: X-Photo-Filename, in: header, required: true, description: Percent-encoded original filename, schema: {type: string}}
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '201': {description: Immutable owner/client receipt; actual decoded unchanged original, content: {application/json: {schema: {$ref: '#/components/schemas/PhotoReceipt'}}}}
        '200': {description: Same-key same-content receipt; consumes no additional upload allowance, content: {application/json: {schema: {$ref: '#/components/schemas/PhotoReceipt'}}}}
        '400': {description: Invalid filename/header/key}
        '401': {description: Workspace sign-in required}
        '403': {description: Current owner/client admission denied}
        '408': {description: Stream exceeded total 15 second deadline}
        '409': {description: Key bound to different bytes, filename or client}
        '413': {description: Actual stream exceeds 10 MiB}
        '422': {description: Unsupported, corrupt, hash mismatch or dimensions exceed 24 million pixels or 12000 per axis}
        '429': {description: Account rolling daily 40 receipt or 100 MiB allowance exhausted}
        '503': {description: Generation readiness off, decoder busy/unavailable or storage unavailable}
  /v1/office/customer-accounts:
    get:
      security: [{NamedOfficeAdministrator: []}]
      responses:
        '200': {description: Latest 200 governed account mappings}
        '403': {description: Current named administrator session required}
    put:
      security: [{NamedOfficeAdministrator: []}]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, clientIds, active, expectedVersion, dailyJobs, concurrentJobs, reason]
              properties:
                subject: {type: string, format: uuid, description: Verified workspace Auth subject; never a browser-supplied office identity.}
                clientIds: {type: array, uniqueItems: true, maxItems: 20, items: {type: string, format: uuid}}
                active: {type: boolean}
                expectedVersion: {type: integer, minimum: 0, description: Zero for initial admission; otherwise the current version.}
                dailyJobs: {type: integer, minimum: 1, maximum: 100}
                concurrentJobs: {type: integer, minimum: 1, maximum: 10}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: Idempotent versioned admission or revocation; dedicated requester only, immutable audit.}
        '400': {description: Invalid fields or action key}
        '403': {description: Named administrator or client authority absent}
        '409': {description: Expected version or action payload conflict}
        '503': {description: Admission transaction unavailable; preserve the action key}
components:
  securitySchemes:
    WorkspaceMember: {type: http, scheme: bearer, bearerFormat: Supabase user JWT, description: Pinned workspace issuer and current has_app_access verified server-side on every request. Office keys and anonymous or service identities are refused.}
    NamedOfficeAdministrator: {type: http, scheme: bearer, bearerFormat: Hawa named Google OIDC session, description: Current persisted administrator and active session; shared office keys cannot provision customers.}
  schemas:
    ActionCopy:
      type: array
      minItems: 1
      maxItems: 8
      description: Explicit full replacement text only; at most 8000 characters combined. Omission preserves existing exact copy.
      items: {type: object, additionalProperties: false, required: [text, language], properties: {text: {type: string, minLength: 1, maxLength: 4000}, language: {type: string, enum: [en, ar, ckb]}}}
    CustomerAction:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, expectedVersion, reason]
          properties: {kind: {const: cancel}, expectedVersion: {type: integer, minimum: 1}, reason: {type: string, minLength: 1, maxLength: 1000}}
        - type: object
          additionalProperties: false
          required: [kind, expectedVersion, messageId]
          properties: {kind: {const: seen}, expectedVersion: {type: integer, minimum: 1}, messageId: {type: string, format: uuid}}
        - type: object
          additionalProperties: false
          required: [kind, expectedVersion, messageId, directive]
          properties: {kind: {const: answer}, expectedVersion: {type: integer, minimum: 1}, messageId: {type: string, format: uuid}, directive: {type: string, minLength: 1, maxLength: 4000}, exactCopy: {$ref: '#/components/schemas/ActionCopy'}}
        - type: object
          additionalProperties: false
          required: [kind, expectedVersion, directive, category]
          properties: {kind: {const: revise}, expectedVersion: {type: integer, minimum: 1}, directive: {type: string, minLength: 1, maxLength: 4000}, category: {type: string, enum: [layout, imagery, typography, copy, other]}, exactCopy: {$ref: '#/components/schemas/ActionCopy'}}
    ActionReceipt:
      type: object
      required: [id, requestId, kind, expectedVersion, phase, code, createdAt]
      properties:
        id: {type: string, format: uuid}
        requestId: {type: string, format: uuid}
        kind: {type: string, enum: [revise, answer, seen, cancel]}
        expectedVersion: {type: integer, minimum: 1}
        phase: {type: string, enum: [queued, projected, applied, refused]}
        code: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    ActionResponse:
      type: object
      required: [action, created]
      properties: {action: {$ref: '#/components/schemas/ActionReceipt'}, created: {type: boolean}}
    CustomerActions:
      type: object
      required: [canRevise, canCancel, questionMessageId, receipts]
      properties:
        canRevise: {type: boolean}
        canCancel: {type: boolean}
        questionMessageId: {type: [string, 'null'], format: uuid}
        receipts: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/ActionReceipt'}}
    NativeReview:
      type: object
      additionalProperties: false
      required: [status, requestVersion, previewId, previewSha256, basisSha256, checkedAt, reasons, files]
      properties:
        status: {type: string, enum: [ready, blocked]}
        requestVersion: {type: integer, minimum: 1}
        previewId: {type: string, format: uuid}
        previewSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        basisSha256: {type: string, pattern: '^[a-f0-9]{64}$', description: Canonical evidence fingerprint, not an authorization token or approval.}
        checkedAt: {type: string, format: date-time}
        reasons:
          type: array
          maxItems: 9
          uniqueItems: true
          items: {type: string, enum: [FILES_INVALID, DIMENSIONS_CHANGED, COPY_CHANGED, CAPTURE_POLICY_CHANGED, QUALITY_CHECK_FAILED, RTL_REVIEW_REQUIRED, ASSET_FIDELITY_FAILED, NATIVE_DESIGN_CHANGED, NATIVE_CHECK_UNAVAILABLE]}
        files:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [id, sha256, size, format]
            properties:
              id: {type: string, format: uuid}
              sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
              size: {type: integer, minimum: 32, maximum: 26214400}
              format: {type: string, enum: [png, pptx]}
      oneOf:
        - properties: {status: {const: ready}, reasons: {maxItems: 0}, files: {minItems: 2, maxItems: 2}}
        - properties: {status: {const: blocked}, reasons: {minItems: 1}, files: {maxItems: 0}}
    CapturedPreview:
      type: object
      additionalProperties: false
      required: [id, requestVersion, bindingVersion, sha256, size, capturedAt]
      properties:
        id: {type: string, format: uuid}
        requestVersion: {type: integer, minimum: 1}
        bindingVersion: {type: integer, minimum: 1}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        size: {type: integer, minimum: 33, maximum: 26214400}
        capturedAt: {type: string, format: date-time}
    PhotoReceipt:
      type: object
      required: [photo, created]
      properties:
        created: {type: boolean}
        photo:
          type: object
          required: [id, filename, sha256, mediaType, size, width, height]
          properties:
            id: {type: string, format: uuid}
            filename: {type: string, maxLength: 255}
            sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            mediaType: {type: string, enum: [image/png, image/jpeg, image/webp]}
            size: {type: integer, minimum: 1, maximum: 10485760}
            width: {type: integer, minimum: 1, maximum: 12000}
            height: {type: integer, minimum: 1, maximum: 12000}
    CustomerDesignRequest:
      type: object
      additionalProperties: false
      required: [clientId, title, exactCopy, designInstructions, variant]
      properties:
        clientId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        exactCopy:
          type: array
          minItems: 1
          maxItems: 8
          description: At most 8000 characters combined; exact text is preserved, separate from instructions.
          items: {type: object, additionalProperties: false, required: [text, language], properties: {text: {type: string, minLength: 1, maxLength: 4000}, language: {type: string, enum: [en, ckb, ar]}}}
        designInstructions: {type: string, maxLength: 4000}
        variant: {type: string, enum: [square, portrait, story]}
        photoIds: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}, description: Owned client-bound receipts in requester order; duplicate image hashes rejected}
        photoUsage:
          oneOf:
            - {type: object, additionalProperties: false, required: [mode], properties: {mode: {type: string, enum: [auto, all]}}}
            - {type: object, additionalProperties: false, required: [mode, count], properties: {mode: {type: string, enum: [count]}, count: {type: integer, minimum: 1, maximum: 20}}}
    CustomerJob:
      type: object
      additionalProperties: false
      required: [id, clientId, title, state, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        clientId: {type: string, format: uuid}
        title: {type: string}
        state: {type: string, description: Hawa task_state vocabulary.}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    JobReceipt:
      type: object
      required: [job, created]
      properties:
        job: {$ref: '#/components/schemas/CustomerJob'}
        created: {type: boolean}
