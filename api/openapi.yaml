      properties:
        schemaVersion: {type: integer, const: 2}
        evidenceKind: {type: string, const: independent_probe}
        checkedAt: {type: string, format: date-time}
        basis: {type: string, const: sampled_office_readiness}
        period:
          type: object
          required: [month, startAt, endAt, throughAt, complete]
