          type: object
          required: [id, targetOrigin, scopeSha256, intervalSeconds, status, lastObservedAt, lastReceivedAt]
          properties:
            id: {type: string, format: uuid}
            targetOrigin: {type: string, format: uri}
            scopeSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            intervalSeconds: {type: integer, const: 60}
            status: {type: string, enum: [awaiting_observations, fresh, stale]}
            lastObservedAt: {type: [string, 'null'], format: date-time}
            lastReceivedAt: {type: [string, 'null'], format: date-time}
        availability:
          type: object
          required: [targetPercent, window, timeZone, elapsedSlots, observationCount, availableSlots, unavailableSlots, unknownSlots, missingSlots, coveragePercent, observedPercent, minimumPercent, maximumPercent, sloCompliant]
          properties:
            targetPercent: {type: number, const: 99.5}
            window: {type: string, const: calendar_month}
            timeZone: {type: string, const: Asia/Baghdad}
            elapsedSlots: {type: integer, minimum: 0}
            observationCount: {type: integer, minimum: 0}
            availableSlots: {type: integer, minimum: 0}
            unavailableSlots: {type: integer, minimum: 0}
            unknownSlots: {type: integer, minimum: 0, description: Explicitly unknown plus missing slots}
            missingSlots: {type: integer, minimum: 0}
            coveragePercent: {type: [number, 'null'], minimum: 0, maximum: 100}
            observedPercent: {type: [number, 'null'], minimum: 0, maximum: 100}
            minimumPercent: {type: [number, 'null'], minimum: 0, maximum: 100}
            maximumPercent: {type: [number, 'null'], minimum: 0, maximum: 100}
            sloCompliant: {type: [boolean, 'null'], description: Null until the month is complete and all slots have known outcomes}
        latency:
          type: object
          required: [scope, p50Ms, p95Ms, p99Ms, observationCount]
          properties:
            scope: {type: string, const: successful_readiness_probe_round_trip}
            p50Ms: {type: [integer, 'null'], minimum: 0, maximum: 60000}
            p95Ms: {type: [integer, 'null'], minimum: 0, maximum: 60000}
