  /v1/clients/{clientId}/dna:
    get:
      tags: [Clients]
      operationId: getClientDNA
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - name: version
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '200': {description: Client DNA, content: {application/json: {schema: {$ref: '../schemas/ClientDNA.schema.json'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Clients]
      operationId: createClientDNAVersion
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '../schemas/ClientDNA.schema.json'}}}
      responses:
        '201': {description: Draft DNA version created, content: {application/json: {schema: {$ref: '../schemas/ClientDNA.schema.json'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/dna/model-consent:
    get:
      tags: [Clients]
      operationId: getClientModelConsent
      summary: What the model-reading gates see for this client now (ADR-234)
      description: Office staff (administrator, operator, auditor). Reads the active DNA version, whether it is approved, its privacy block, the client's egress policy and whether the intake router's gate admits OpenAI. Changes nothing.
      parameters: [{$ref: '#/components/parameters/ClientId'}]
      responses:
        '200':
          description: Current consent state
          content:
            application/json:
              schema:
                type: object
                required: [clientId, version, approved, approvedBy, privacy, commitMessage, clientPolicy, modelReading]
                properties:
                  clientId: {type: string, format: uuid}
                  version: {type: [integer, 'null']}
                  approved: {type: boolean}
                  approvedBy: {type: [string, 'null'], format: uuid}
                  privacy: {type: [object, 'null']}
                  commitMessage: {type: [string, 'null']}
                  clientPolicy: {type: [object, 'null']}
                  modelReading: {type: object, required: [openai], properties: {openai: {type: boolean}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Clients]
      operationId: recordClientModelConsent
      summary: Record or withdraw a client's consent to model readings (ADR-234)
      description: >-
        A person with the administrator role only (never a service, worker or test identity; the
        membership is checked in PostgreSQL). Makes the next DNA version with the active DNA unchanged
        except privacy.modelEgressMode and privacy.allowedProviders, created and approved by the acting
        administrator; supersedes the previous version and appends an audit event. providers [] or mode
        none/local_only withdraws (stored as local_only with no providers). The same request sent again
        after it was applied answers 200 with replayed true; any other request on a stale version is 409.
      parameters: [{$ref: '#/components/parameters/ClientId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, mode, providers, reason]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                mode: {type: string, enum: [approved_providers, evaluated_external_allowed, local_only, none]}
                providers: {type: array, uniqueItems: true, maxItems: 3, items: {type: string, enum: [openai, google, anthropic]}}
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        '201': {description: New approved DNA version recorded, content: {application/json: {schema: {$ref: '#/components/schemas/ClientModelConsentResult'}}}}
        '200': {description: Replay of an applied request, or the consent was already recorded, content: {application/json: {schema: {$ref: '#/components/schemas/ClientModelConsentResult'}}}}
        '400': {description: Anything but the four fields, an unknown provider or mode, or no reason}
        '403': {description: Not an administrator, or not a person who is an active administrator of the office}
        '409': {description: The active DNA version is not expectedVersion (and this is not a replay), or the client has no DNA}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/source-files:
    get:
      tags: [Clients]
      operationId: listRetainedTelegramSources
      summary: Inspect the latest 20 retained Telegram PDF and voice originals, including stopped extraction
      description: Requires an office session and current client access. Returns source identities and review state without raw messages, sender identities or extracted copy. Copy review is not design or knowledge approval.
      parameters: [{$ref: '#/components/parameters/ClientId'}]
      responses:
        '200':
          description: Retained originals in this client
          content:
            application/json:
              schema:
                type: object
                required: [clientId, items]
                properties:
                  clientId: {type: string, format: uuid}
                  items:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      required: [kind, clientId, updateId, sourceSha256, createdAt, documentId, stage, message]
                      properties:
                        kind: {type: string, enum: [pdf, voice]}
                        clientId: {type: string, format: uuid}
                        updateId: {type: integer, minimum: 1}
                        sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                        createdAt: {type: string, format: date-time}
                        documentId: {type: [string, 'null'], format: uuid}
                        stage: {type: string, enum: [retained, ready, copy_confirmed, extraction_stopped]}
                        message: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/source-files/{updateId}/content:
    get:
      tags: [Clients]
      operationId: downloadRetainedTelegramSource
      summary: Download the hash-verified PDF or voice original even if extraction stopped
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: updateId, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Original attachment with private no-store caching, content: {application/pdf: {schema: {type: string, format: binary}}, audio/ogg: {schema: {type: string, format: binary}}}}
        '404': {description: Source or client unavailable to the current session}
        '503': {description: Original bytes unavailable or corrupt}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/source-files/{updateId}/review:
    get:
      tags: [Clients]
      operationId: inspectRetainedVoiceSource
      summary: Inspect unreviewed transcription and durable paid-call state
      description: Requires current client access. Does not dispatch a model or approve copy. Missing or uncertain outcomes never cause a retry. Actual billed cost remains unknown.
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: updateId, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Client-scoped retained voice evidence
          content:
            application/json:
              schema:
                type: object
                required: [clientId, updateId, sourceSha256, state, message, transcript, estimatedUsd, actualUsd, audio]
                properties:
                  clientId: {type: string, format: uuid}
                  updateId: {type: integer, minimum: 1}
                  sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                  state: {type: string, enum: [manual, received, rejected, uncertain]}
                  message: {type: string}
                  transcript: {type: [string, 'null'], maxLength: 100000}
                  estimatedUsd: {type: [number, 'null'], minimum: 0}
                  actualUsd: {type: 'null'}
                  attemptKey: {type: string, pattern: '^[0-9a-f]{64}$'}
                  providerRequestId: {type: [string, 'null'], pattern: '^req_[A-Za-z0-9_-]{1,180}$'}
                  audio:
                    type: [object, 'null']
                    properties:
                      durationSeconds: {type: number, exclusiveMinimum: 0, maximum: 600}
                      channels: {type: integer, enum: [1, 2]}
        '404': {description: Voice source or client unavailable to the current session}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/documents:
    post:
      tags: [Clients]
      operationId: saveClientPdf
      summary: Retain an original PDF and its native extraction for an explicit Desk request
      description: Active writable client required. Source bytes are content-addressed; client/source hash/extractor version replays reuse an immutable receipt. Never indexes knowledge, creates a task or approves a design. Requires local blob storage and, for new sources, the isolated PDF parser. Limits match inspection.
      parameters: [{$ref: '#/components/parameters/ClientId'}]
      requestBody:
        required: true
        content: {application/pdf: {schema: {type: string, format: binary}}}
      responses:
        '201': {description: Original bytes and extraction retained, content: {application/json: {schema: {$ref: '#/components/schemas/SavedClientDocument'}}}}
        '200': {description: Existing retained receipt reused, content: {application/json: {schema: {$ref: '#/components/schemas/SavedClientDocument'}}}}
        default: {$ref: '#/components/responses/Problem'}
    get:
      tags: [Clients]
      operationId: listClientPdfs
      summary: List the latest 20 saved PDF receipts in authorized client scope
      parameters: [{$ref: '#/components/parameters/ClientId'}]
      responses:
        '200': {description: Recent receipts without extraction bodies, content: {application/json: {schema: {type: object, properties: {items: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/ClientDocumentReceipt'}}}}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/documents/{documentId}:
    get:
      tags: [Clients]
      operationId: getClientPdf
      summary: Reopen retained extraction and capability limits
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Saved source receipt and extraction, content: {application/json: {schema: {$ref: '#/components/schemas/SavedClientDocument'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/documents/{documentId}/content:
    get:
      tags: [Clients]
      operationId: downloadClientPdf
      summary: Download hash-verified original bytes after client authorization
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Original attachment with private no-store caching, content: {application/pdf: {schema: {type: string, format: binary}}, audio/ogg: {schema: {type: string, format: binary}}}}
        '404': {description: Receipt outside authorized client scope or unavailable}
        '503': {description: File store unavailable or original bytes missing or corrupt}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/documents/{documentId}/knowledge:
    get:
      tags: [Clients]
      operationId: getDocumentKnowledgeApproval
      summary: Read current reference-search approval and latest 20 audit events
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Current version and current named-manager capability, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentKnowledgeState'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Clients]
      operationId: changeDocumentKnowledgeApproval
      summary: Approve or revoke this exact PDF for client reference search
      description: Requires live named Google office administrator or scoped client DNA manager authority. New approval verifies original bytes and derives immutable chunks from the saved extraction. Expected version and UUID action identity serialize concurrent decisions. Replay requires current authority and returns the original action plus current state; it never restores an old approval. Revocation and replay do not require source bytes. No DNA rule, final copy, model input or design approval is created. Upload limit 8 KiB and 5 seconds.
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DocumentKnowledgeChange'}}}
      responses:
        '201': {description: Immutable action and index transaction committed, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentKnowledgeState'}}}}
        '200': {description: Original action replayed with current state, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentKnowledgeState'}}}}
        '409': {description: Stale version, changed source hashes, inactive client or reused action identity}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/knowledge/search:
    get:
      tags: [Clients]
      operationId: searchApprovedClientDocuments
      summary: Search approved retained PDF passages in an active authorized client
      description: PostgreSQL normalized exact substring, simple full-text and trigram search. Tenant, client and latest approval are filtered in a materialized relation before ranking. Up to 10 passages, 2000 original characters each, with immutable source, chunk, page and approval citations. No vector, reranker or automatic model context. Private no-store; results represent the query snapshot. Queries have a 3-second database timeout.
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}, description: At most 50 whitespace-separated words; at least one letter or numeral.}
      responses:
        '200': {description: Scoped lexical results with original text and citations, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentKnowledgeSearch'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/documents/inspect:
    post:
      tags: [Clients]
      operationId: inspectClientPdf
      summary: Preview native PDF text locally without saving or approving it
      description: Requires active client access before and after extraction. Limits are 20 MiB and 40 pages. OCR, semantic reading order, tables and images are not extracted. Partial or textless-page results are refused.
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
      requestBody:
        required: true
        content:
          application/pdf:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Unsaved, unapproved text preview with original source hash and measured page coordinates
          content:
            application/json:
              schema:
                type: object
                required: [clientId, sourceSaved, approved, document]
                properties:
                  clientId: {type: string, format: uuid}
                  sourceSaved: {type: boolean, const: false}
                  approved: {type: boolean, const: false}
                  document: {type: object, description: 'Source SHA-256, stable chunks with text/page/coordinates, and extractor version/capability limitations.'}
        '404': {description: Client unavailable or unauthorized}
        '408': {description: Upload deadline exceeded}
        '413': {description: Input size limit exceeded}
        '422': {description: Unsupported, partial, textless or invalid PDF extraction}
        '503': {description: Local parser or authorization store unavailable}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operations/failures:
    get:
      tags: [Operations]
      operationId: listFailures
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Actionable failures
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/FailureItem'}}
                  nextCursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operations/legacy-path:
    get:
      tags: [Operations]
      operationId: getLegacyPathStatus
      summary: What is still on the old Telegram path (ADR-135); administrators only, read-only
      responses:
        '200':
          description: Open legacy Telegram tasks, queued Core requester sends and legacy Delivery runs; stage2Ready when all are zero
          content:
            application/json:
              schema:
                type: object
                required: [openTasks, pendingRequesterSends, failedRequesterSends, legacyWorkflowDeliveriesRunning, newestLegacyTaskCreatedAt, stage2Ready]
                properties:
                  openTasks:
                    type: object
                    required: [total, byState, byPin, chats, oldestUpdatedAt, items]
                    properties:
                      total: {type: integer, minimum: 0}
                      byState: {type: object, additionalProperties: {type: integer}}
                      byPin: {type: object, additionalProperties: {type: integer}}
                      chats: {type: integer, minimum: 0}
                      oldestUpdatedAt: {type: [string, 'null'], format: date-time}
                      items:
                        type: array
                        maxItems: 50
                        items:
                          type: object
                          required: [id, state, pin, createdAt, updatedAt]
                          properties:
                            id: {type: string, format: uuid}
                            state: {type: string}
                            pin: {type: string, enum: [core, restate]}
                            createdAt: {type: string, format: date-time}
                            updatedAt: {type: string, format: date-time}
                  pendingRequesterSends: {type: integer, minimum: 0}
                  failedRequesterSends: {type: integer, minimum: 0}
                  legacyWorkflowDeliveriesRunning: {type: integer, minimum: 0}
                  newestLegacyTaskCreatedAt: {type: [string, 'null'], format: date-time}
                  stage2Ready: {type: boolean}
        default: {$ref: '#/components/responses/Problem'}
  /v1/integrations/health:
    get:
      tags: [Integrations]
      operationId: getIntegrationHealth
      responses:
        '200':
          description: Integration health
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [integrationId, kind, state, checkedAt]
                      properties:
                        integrationId: {type: string, format: uuid}
                        kind: {type: string}
                        state: {enum: [healthy, degraded, unavailable, disabled, reauth_required, unknown]}
                        checkedAt: {type: string, format: date-time}
                        detail: {type: object}
        default: {$ref: '#/components/responses/Problem'}
  /v1/evaluations/datasets:
    get:
      tags: [Evaluations]
      operationId: listFixtureDatasets
      description: Allowlisted corpus definitions with measured counts and SHA-256 of the exact file bytes. Availability does not indicate passing tests. Unreadable datasets have null count and source.
      responses:
        '200': {description: Dataset metadata; no-store, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/evaluations/datasets/{datasetId}/cases:
    get:
      tags: [Evaluations]
      operationId: readFixtureCases
      parameters:
        - {name: datasetId, in: path, required: true, schema: {type: string, enum: [brief, rtl, retrieval]}}
      responses:
        '200':
          description: Case definitions and source identity; these are not execution outcomes
          content:
            application/json:
              schema:
                type: object
                required: [datasetId, total, source, cases]
                properties:
                  datasetId: {type: string}
                  total: {type: integer, minimum: 0}
                  source: {$ref: '#/components/schemas/EvaluationDatasetSource'}
                  cases: {type: array, items: {type: object}}
        '404': {description: Unknown dataset identity}
        '503': {description: Corpus unavailable or invalid; internal filesystem details excluded}
        default: {$ref: '#/components/responses/Problem'}
  /v1/evaluations/runs:
    get:
      tags: [Evaluations]
      operationId: listEvaluationRuns
      responses:
        '200': {description: Tenant-scoped durable fixture runs, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Evaluations]
      operationId: startEvaluation
      description: Run or resume the same fixture evaluation using a stable action UUID. Results are diagnostics, not model admission evidence.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 160}
      responses:
        '200': {description: Saved completed or stopped evaluation result, content: {application/json: {schema: {type: object}}}}
        '409': {description: Running, unsettled, version mismatch or changed action inputs}
        '503': {description: Durable storage or outcome unavailable; retry only the same action}
        default: {$ref: '#/components/responses/Problem'}
  /v1/evaluations/runs/{runId}:
    get:
      tags: [Evaluations]
      operationId: getEvaluationRun
      parameters:
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Saved tenant-scoped evaluation run
          content:
            application/json:
              schema:
                type: object
                required: [runId, actionId, status, name, report, resumable]
                properties:
                  runId: {type: string, format: uuid}
                  actionId: {type: string, format: uuid}
                  name: {type: string}
                  status: {enum: [running, completed, failed, closed]}
                  report: {anyOf: [{$ref: '#/components/schemas/FixtureEvaluationReport'}, {type: 'null'}]}
                  resumable: {type: boolean}
                  snapshotHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                  canSettle: {type: boolean}
                  daily: {$ref: '#/components/schemas/SharedDailySpending'}
                  calls:
                    type: array
                    items:
                      type: object
                      properties:
                        allocatedUsd: {type: [number, 'null'], description: Original daily allocation; distinct from the gateway request bound and actual usage}
                        spendingPolicyVersion: {type: [integer, 'null']}
                  settlement: {type: [object, 'null'], description: Administrator-attested terminal provider evidence; never an automated invoice verification}
        default: {$ref: '#/components/responses/Problem'}
  /v1/evaluations/runs/{runId}/settlement:
    post:
      tags: [Evaluations]
      operationId: settleHeldEvaluation
      description: A current named Google office administrator closes a held fixture evaluation using terminal provider evidence and known reported costs. Preserves the original report and call outcomes. Sends no model request. Repeating the same action returns its saved settlement.
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedSnapshot, reason, calls]
              properties:
                expectedSnapshot: {type: string, pattern: '^[a-f0-9]{64}$'}
                reason: {type: string, minLength: 1, maxLength: 500}
                calls:
                  type: array
                  maxItems: 1000
                  description: Every pending or uncertain call exactly once. Empty only for an interrupted run with no unresolved calls.
                  items:
                    type: object
                    additionalProperties: false
                    required: [callId, conclusion, reportedCostUsd, evidenceReference, evidenceSha256]
                    properties:
                      callId: {type: string, format: uuid}
                      conclusion: {enum: [provider_not_accepted, provider_finished]}
                      reportedCostUsd: {type: number, minimum: 0, maximum: 1000000, description: Administrator-reported final USD cost; zero required for provider_not_accepted; unknown refused}
                      evidenceReference: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:/-]{0,199}$'}
                      evidenceSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: Immutable settlement and replay indicator}
        '400': {description: Invalid or unknown evidence/cost}
        '403': {description: Current named administrator session required}
        '409': {description: Active execution, changed snapshot/action, prior settlement or incomplete evidence}
        '503': {description: Outcome unavailable; retry the same settlement action}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/studio-recovery/{runId}:
    get:
      tags: [Studio]
      operationId: readStudioRecoveryEvidence
      description: Scoped original call receipts, separate administrator attestations, snapshot and current named settlement authority.
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Original call outcomes and separate settlement history; no provider transport}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/studio-recovery/{runId}/settlement:
    post:
      tags: [Studio]
      operationId: settleStoppedStudioCalls
      description: Records named administrator-attested terminal provider evidence for all unresolved calls in a stopped Studio run. Preserves task ownership, run state, original call outcomes and budgets. Sends no model request. Evidence applies to exact calls, never later parity calls. Repeating the same action returns its saved settlement.
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedSnapshot, reason, calls]
              properties:
                expectedSnapshot: {type: string, pattern: '^[a-f0-9]{64}$'}
                reason: {type: string, minLength: 1, maxLength: 500}
                calls:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  description: Every currently unsettled uncertain call exactly once.
                  items:
                    type: object
                    additionalProperties: false
                    required: [callId, conclusion, reportedCostUsd, evidenceReference, evidenceSha256]
                    properties:
                      callId: {type: string, format: uuid}
                      conclusion: {enum: [provider_not_accepted, provider_finished]}
                      reportedCostUsd: {type: number, minimum: 0, maximum: 1000000, description: Administrator-reported final USD cost; zero required for provider_not_accepted; unknown refused}
                      evidenceReference: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:/-]{0,199}$'}
                      evidenceSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: Immutable settlement and replay indicator}
        '400': {description: Invalid or unknown evidence/cost}
        '403': {description: Current named administrator session required}
        '409': {description: Run not stopped, changed snapshot/action or incomplete evidence}
        '503': {description: Outcome unavailable; retry the same settlement action}
        default: {$ref: '#/components/responses/Problem'}
  /v1/spending/policy:
    get:
      tags: [Operations]
      operationId: readSpendingPolicy
      description: Office administrator, operator or auditor reads the current immutable policy, daily ledger usage, office clients and up to 20 history revisions. Named authority determines canEdit. Asia/Baghdad day is fixed. No provider call occurs.
      parameters:
        - {name: beforeVersion, in: query, schema: {type: integer, minimum: 1, maximum: 2147483647}}
      responses:
        '200': {description: Current policy with limits/hash/version/provenance, consistent daily usage, history, nextBeforeVersion, client choices and canEdit}
        '403': {description: Authorized office role required}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Operations]
      operationId: recordSpendingPolicy
      description: Current named administrator appends an immutable office/client/role policy revision. SQL verifies authority and expected version/hash under the existing spending admission lock. Zero stops new spending; existing charges, reservations, history and execution holds remain. Exact action replay precedes the current-version check and rechecks authority. Shared administrator keys cannot write.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, expectedLimitsSha256, reason, limits]
              properties:
                expectedVersion: {type: integer, minimum: 1, maximum: 2147483646}
                expectedLimitsSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                reason: {type: string, minLength: 1, maxLength: 500}
                limits:
                  type: object
                  additionalProperties: false
                  required: [officeUsd, clientUsd, roleUsd, clients, roles]
                  properties:
                    officeUsd: {type: number, minimum: 0, maximum: 1000000, multipleOf: 0.000001}
                    clientUsd: {type: number, minimum: 0, maximum: 1000000, multipleOf: 0.000001}
                    roleUsd: {type: number, minimum: 0, maximum: 1000000, multipleOf: 0.000001}
                    clients:
                      type: object
                      maxProperties: 1000
                      propertyNames: {pattern: '^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$'}
                      additionalProperties: {type: number, minimum: 0, maximum: 1000000, multipleOf: 0.000001}
                    roles:
                      type: object
                      propertyNames: {enum: [creative_director, visual_judge, asset_photoreal, intake_router, brief_builder, feedback_classifier, rule_miner, embedding_multimodal, reranker_multimodal, voice_transcriber, health_probe]}
                      additionalProperties: {type: number, minimum: 0, maximum: 1000000, multipleOf: 0.000001}
      responses:
        '200': {description: Saved attributed policy receipt and replayed flag}
        '400': {description: Invalid limits, unknown role or client outside this office}
        '403': {description: Current named administrator required}
        '409': {description: Policy changed or action reused for a different proposal}
        '503': {description: Outcome unavailable; retry the same saved action}
        default: {$ref: '#/components/responses/Problem'}
  /v1/spending/calls:
    get:
      tags: [Operations]
      operationId: listCallCostEvidence
      description: Office administrator, operator or auditor reads sanitized Studio, evaluation and voice call costs. At most 50 newest records per page; opaque keyset cursor retains timestamp precision. No provider call or raw answer is exposed.
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 500}}
      responses:
        '200': {description: Call cost evidence items and nextCursor; original unknown costs remain null}
        '403': {description: Authorized office role required}
        default: {$ref: '#/components/responses/Problem'}
  /v1/spending/calls/{kind}/{callId}:
    get:
      tags: [Operations]
      operationId: readCallCostEvidence
      parameters:
        - {name: kind, in: path, required: true, schema: {enum: [studio, evaluation, voice, health_probe, canva_planner]}}
        - {name: callId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Exact snapshotHash, original cost and outcome, reserved USD, conservative accounted USD, attributed revision history, conflicts and current canRecord authority}
        '404': {description: Call absent from this office}
        default: {$ref: '#/components/responses/Problem'}
  /v1/spending/calls/{kind}/{callId}/evidence:
    post:
      tags: [Operations]
      operationId: recordCallCostEvidence
      description: Appends a named administrator cost attestation for one exact call. Snapshot and authority are checked again in SQL. The highest original, settled or attested charge remains counted. Terminal evidence releases unused reserves; this changes no outcome, score, workflow state or execution hold and dispatches no provider request. Corrections append revisions. Same-action retries return the saved receipt.
      parameters:
        - {name: kind, in: path, required: true, schema: {enum: [studio, evaluation, voice, health_probe, canva_planner]}}
        - {name: callId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedSnapshot, reason, calls]
              properties:
                expectedSnapshot: {type: string, pattern: '^[a-f0-9]{64}$'}
                reason: {type: string, minLength: 1, maxLength: 500}
                calls:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [callId, conclusion, reportedCostUsd, evidenceReference, evidenceSha256]
                    properties:
                      callId: {type: string, format: uuid, description: Must equal the path callId}
                      conclusion: {enum: [provider_not_accepted, provider_finished]}
                      reportedCostUsd: {type: number, minimum: 0, maximum: 1000000, description: Known administrator-attested final charge; not_accepted requires zero and no contrary original evidence}
                      evidenceReference: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:/-]{0,199}$'}
                      evidenceSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: Immutable receipt identity/revision/actor/time and replay indicator}
        '400': {description: Invalid or unknown cost evidence}
        '403': {description: Current named administrator and CSRF protection required}
        '404': {description: Call absent from this office}
        '409': {description: Changed snapshot/action or contradictory non-acceptance evidence}
        '503': {description: Outcome unconfirmed; retry the same saved action}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    WorkspaceMember:
      $ref: "./customer-design.openapi.yaml#/components/securitySchemes/WorkspaceMember"
    availabilityMonitor:
      type: http
      scheme: bearer
      description: Dedicated independent collector secret. Opens only the two availability monitoring routes; grants no office or worker authority.
    officeBearer:
      $ref: './canva-connect.openapi.json#/components/securitySchemes/officeBearer'
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://accounts.google.com/.well-known/openid-configuration
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MessageId:
      name: messageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClientId:
      name: clientId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 200}
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      schema: {type: integer, minimum: 1}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    Problem:
      description: RFC 9457-style problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    RetainedUploadedAsset:
      type: object
      required: [assetId, clientId, category, filename, mimeType, sha256, sourceSha256, sizeBytes, storageKey, sanitized, createdAt, contentUrl]
      properties:
        assetId: {type: string, format: uuid}
        clientId: {type: string, format: uuid}
        category: {type: string}
        filename: {type: string}
        mimeType: {type: string}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        sizeBytes: {type: integer, minimum: 1}
        storageKey: {type: string}
        sanitized: {type: boolean}
        createdAt: {type: string, format: date-time}
        contentUrl: {type: string}
    ClientModelConsentResult:
      type: object
      required: [clientId, version, previousVersion, changed, replayed, privacy, approvedBy, contentHash, modelReading]
      properties:
        clientId: {type: string, format: uuid}
        version: {type: integer}
        previousVersion: {type: integer}
        changed: {type: boolean}
        replayed: {type: boolean}
        privacy: {type: object}
        approvedBy: {type: string, format: uuid}
        contentHash: {type: string}
        modelReading: {type: object, required: [openai], properties: {openai: {type: boolean}}}
    PublicationInspectionState:
      type: object
      required: [schemaVersion, tenantId, userId, checkedAt, schedule, items, nextAfter]
      properties:
        schemaVersion: {type: integer, const: 1}
        tenantId: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        checkedAt: {type: string, format: date-time}
        nextAfter: {type: [string, 'null'], format: uuid}
        schedule:
          type: object
          required: [enabled, intervalMinutes]
          properties:
            enabled: {type: boolean}
            intervalMinutes: {type: integer, const: 60}
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [publicationId, taskId, clientId, inspectionId, state, status, stale, startedAt, finishedAt, inputsSha256, resultSha256, checkedFiles, findings]
            properties:
              publicationId: {type: string, format: uuid}
              taskId: {type: string, format: uuid}
              clientId: {type: string, format: uuid}
              inspectionId: {type: [string, 'null'], format: uuid}
              state: {type: string, enum: [uninspected, running, finished, interrupted, superseded]}
              status: {type: string, enum: [consistent, divergent, unverified]}
              stale: {type: boolean}
              startedAt: {type: [string, 'null'], format: date-time}
              finishedAt: {type: [string, 'null'], format: date-time}
              inputsSha256: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
              resultSha256: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
              checkedFiles: {type: integer, minimum: 0, maximum: 100}
              findings:
                type: array
                maxItems: 2000
                items:
                  type: object
                  required: [code, resource, resourceId, status]
                  properties:
                    code: {type: string, enum: [ORIGINAL_INPUT_UNAVAILABLE, DRIVE_ID_UNRESERVED, DRIVE_READ_UNAVAILABLE, DRIVE_METADATA_CHANGED, DRIVE_CHECKSUM_UNAVAILABLE, DRIVE_CHECKSUM_CHANGED, DRIVE_DUPLICATES_FOUND, DRIVE_DUPLICATES_UNVERIFIED, PERMISSIONS_BASELINE_UNAVAILABLE, PERMISSIONS_READ_UNAVAILABLE, PERMISSIONS_CHANGED, SHEET_EXPECTATION_UNAVAILABLE, SHEET_READ_UNAVAILABLE, SHEET_ROW_CHANGED]}
                    resource: {type: string, enum: [publication, folder, file, sheet]}
                    resourceId: {type: [string, 'null'], maxLength: 2000}
                    status: {type: string, enum: [divergent, unverified]}
    ReceiptAuditAction:
      type: object
      additionalProperties: false
      required: [actionId, expectedScopeSha256, expectedLatestAuditId, reason]
      properties:
        actionId: {type: string, format: uuid, description: Stable browser-saved identity; equals Idempotency-Key}
        expectedScopeSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        expectedLatestAuditId: {type: [string, 'null'], format: uuid}
        reason: {type: string, minLength: 1, maxLength: 500, description: Trimmed nonempty explanation retained with the audit}
    ReceiptAuditScope:
      type: object
      additionalProperties: false
      required: [sha256, clientIds, includesUnassigned]
      properties:
        sha256: {type: string, pattern: '^[a-f0-9]{64}$', description: Database hash binds tenant, actor, protocol and exact authorized client IDs}
        clientIds:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        includesUnassigned: {type: boolean, const: true}
    ReceiptAuditAnomaly:
      type: object
      additionalProperties: false
      required: [taskId, kind, severity, description, detectedAt]
      properties:
        taskId: {type: string, format: uuid}
        kind: {enum: [ARCHIVE_OUTCOME_UNCONFIRMED, INCOMPLETE_PUBLICATION_EVIDENCE, RECEIPT_HASH_UNCONFIRMED, MISSING_DRIVE_ASSET, MISSING_SHEET_ROW, CHECKSUM_MISMATCH, STATUS_DIVERGENCE]}
        severity: {enum: [high, medium]}
        description: {type: string, minLength: 1}
        detectedAt: {type: string, format: date-time, description: Equals the audit snapshot timestamp}
    StoredReceiptAudit:
      type: object
      required: [auditId, timestamp, basis, simulated, revision, actorUserId, reason, scopeSha256, inputsSha256, reportSha256, totalTasksAudited, totalDriveDeliverablesChecked, totalSheetRowsAudited, inSyncCount, pendingTaskCount, driftCount, anomalies, status]
      properties:
        auditId: {type: string, format: uuid}
        timestamp: {type: string, format: date-time, description: Database transaction time truncated to milliseconds}
        basis: {type: string, minLength: 1, description: Stored PostgreSQL receipt comparison; external Drive and Sheets were not read}
        simulated: {type: boolean, const: false}
        revision: {type: integer, minimum: 1}
        actorUserId: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 500}
        scopeSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        inputsSha256: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of PostgreSQL JSONB input text}
        reportSha256: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of PostgreSQL JSONB report text before transport metadata}
        totalTasksAudited: {type: integer, minimum: 0}
        totalDriveDeliverablesChecked: {type: integer, minimum: 0}
        totalSheetRowsAudited: {type: integer, minimum: 0}
        inSyncCount: {type: integer, minimum: 0, description: Completed deliveries with consistent current-publication receipts}
        pendingTaskCount: {type: integer, minimum: 0, description: Tasks whose delivery is not yet due}
        driftCount: {type: integer, minimum: 0, description: Number of anomalies; multiple anomalies may belong to one task}
        anomalies:
          type: array
          items: {$ref: '#/components/schemas/ReceiptAuditAnomaly'}
        status: {enum: [clean, divergent], description: Clean means zero detected stored-receipt anomalies; it does not verify external delivery}
    ReceiptAuditResult:
      allOf:
        - {$ref: '#/components/schemas/StoredReceiptAudit'}
        - type: object
          required: [replayed]
          properties:
            replayed: {type: boolean}
    ReceiptAuditState:
      type: object
      additionalProperties: false
