openapi: 3.1.0
info:
  title: Hawa Creative OS API
  version: 1.0.0
  description: Private office API. Mutating requests require authentication, authorization, and Idempotency-Key.
servers:
  - url: https://hawa.local/api
security:
  - oidc: []
tags:
  - name: Tasks
  - name: Messages
  - name: Designs
  - name: Clients
  - name: Operations
  - name: Evaluations
  - name: Integrations
paths:
  /v1/customer/session:
    $ref: "./customer-design.openapi.yaml#/paths/~1v1~1customer~1session"
  /v1/customer/jobs:
    $ref: "./customer-design.openapi.yaml#/paths/~1v1~1customer~1jobs"
  /v1/customer/jobs/{id}:
    $ref: "./customer-design.openapi.yaml#/paths/~1v1~1customer~1jobs~1{id}"
  /v1/customer/jobs/{id}/actions:
    $ref: "./customer-design.openapi.yaml#/paths/~1v1~1customer~1jobs~1{id}~1actions"
  /v1/customer/jobs/{id}/download/{acceptanceId}/{format}:
    $ref: './customer-design.openapi.yaml#/paths/~1v1~1customer~1jobs~1{id}~1download~1{acceptanceId}~1{format}'
  /v1/customer/jobs/{id}/review/{captureId}:
    $ref: "./customer-design.openapi.yaml#/paths/~1v1~1customer~1jobs~1{id}~1review~1{captureId}"
  /v1/customer/jobs/{id}/preview/{captureId}:
    $ref: "./customer-design.openapi.yaml#/paths/~1v1~1customer~1jobs~1{id}~1preview~1{captureId}"
  /v1/customer/clients/{clientId}/photos:
    $ref: "./customer-design.openapi.yaml#/paths/~1v1~1customer~1clients~1{clientId}~1photos"
  /v1/office/customer-accounts:
    $ref: "./customer-design.openapi.yaml#/paths/~1v1~1office~1customer-accounts"
  /v1/assets/upload:
    post:
      tags: [Clients]
      operationId: retainUploadedAsset
      summary: Inspect and retain actual client asset bytes
      description: Requires a currently writable active client. Accepts one file up to 10 MiB in a bounded JSON envelope. SVG content is sanitized; each distinct original is retained separately. The server measures size and hashes actual bytes. Client plus admitted SHA-256 reconciles retries, preserving first asset metadata and append-only source receipts. A 503 after interruption may already have committed; retry the same complete content. No font installation, DNA activation, learned label or provider call occurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, filename, mimeType]
              properties:
                clientId: {type: string, maxLength: 128}
                filename: {type: string, minLength: 1, maxLength: 255}
                mimeType: {type: string, enum: [image/png, image/jpeg, image/webp, image/svg+xml, font/ttf, font/otf, font/woff2]}
                category: {type: string, minLength: 1, maxLength: 80}
                sizeBytes: {type: integer, minimum: 1, maximum: 10485760, description: Optional hint; must equal the actual supplied byte count.}
                content: {type: string, description: UTF-8 SVG only; mutually exclusive with contentBase64.}
                contentBase64: {type: string, description: Canonical padded base64 without prefixes or whitespace.}
              oneOf:
                - required: [content]
                  not: {required: [contentBase64]}
                - required: [contentBase64]
                  not: {required: [content]}
      responses:
        '201':
          description: Retained admitted asset with separately addressed original source.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetainedUploadedAsset'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '408': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/assets/{assetId}/content:
    get:
      tags: [Clients]
      operationId: downloadRetainedAsset
      summary: Download verified admitted asset bytes within current client authority
      description: Resolves the actual scoped asset before its blob. Verifies bytes even for conditional reads. Uses attachment, nosniff, sandbox CSP and private no-store headers. Historical metadata-only assets return 409; corrupt or missing retained bytes return 503. A content hash alone grants no access.
      parameters:
        - {$ref: '#/components/parameters/AssetId'}
      responses:
        '200': {description: Verified file bytes in the recorded admitted media type.}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/assets/{assetId}/sources:
    get:
      tags: [Clients]
      operationId: listUploadedAssetSources
      summary: List original source receipts for an authorized asset
      description: Newest 100 source receipts ordered by server time and hash. Explicit truncation does not prove absent older history. Receipts are append-only.
      parameters:
        - {$ref: '#/components/parameters/AssetId'}
      responses:
        '200':
          description: Scoped provenance with explicit truncation.
          content:
            application/json:
              schema:
                type: object
                required: [assetId, items, truncated]
                properties:
                  assetId: {type: string, format: uuid}
                  truncated: {type: boolean}
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [sourceSha256, filename, uploadedBy, createdAt]
                      properties:
                        sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                        filename: {type: string}
                        uploadedBy: {type: string}
                        createdAt: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/assets/{assetId}/sources/{sourceSha256}/content:
    get:
      tags: [Clients]
      operationId: downloadOriginalAssetSource
      summary: Recover an authorized asset's verified original source
      description: Resolves a matching tenant/client/asset/source receipt first. Original unsanitized bytes are served only as application/octet-stream attachments with sandbox CSP, nosniff and private no-store. Unknown receipt or unauthorized asset returns 404; unavailable or corrupt bytes return 503.
      parameters:
        - {$ref: '#/components/parameters/AssetId'}
        - name: sourceSha256
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200': {description: Verified original file bytes, content type application/octet-stream.}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/search:
    get:
      tags: [Operations]
      operationId: searchOfficeHistory
      summary: Search authorized stored office work and history
      description: Read-only lexical search with current tenant/client membership enforced in PostgreSQL. Registered identity does not require active DNA. Exact request/Studio/revision copy, ledger/Studio feedback and revisions use allowlisted fields. Client/task/revision disagreements are excluded. Matching precedes bounded history reads; truncated results do not prove absent history. No model call, label or approval is created.
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 512}
        - name: clientId
          in: query
          description: Authorized client UUID/code/alias, or all for the caller's authorized scope.
          schema: {type: string}
        - name: category
          in: query
          schema:
            type: string
            default: all
            enum: [all, tasks, clients, assets, rules, copy, feedback, revisions]
        - name: limit
          in: query
          description: Requested page size; valid positive sizes are capped at 200.
          schema: {type: integer, minimum: 1, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Scoped search results, with strict task/revision navigation and explicit truncation.
          content:
            application/json:
              schema:
                type: object
                required: [results, resultsCount, scopeEnforced, truncated]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, category, title, url]
                      properties:
                        id: {type: string}
                        category: {type: string, enum: [TASKS, CLIENTS, ASSETS, RULES, COPY, FEEDBACK, REVISIONS]}
                        title: {type: string}
                        subtitle: {type: string}
                        url: {type: [string, 'null']}
                        badge: {type: string}
                  resultsCount: {type: integer, minimum: 0}
                  scopeEnforced: {type: boolean}
                  truncated: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operations/publication-inspections:
    get:
      tags: [Operations]
      operationId: readPublicationInspections
      summary: Read the latest independent Google observations for current publications
      description: Current tenant and client membership filters immutable inspection evidence. Returns at most 50 current publications ordered by publication UUID. A read never dispatches provider work. Hourly checks use frozen original inputs; missing permission policy remains unverified. Results older than two hours cannot certify consistency. Cache-Control is no-store.
      parameters:
        - name: after
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Latest scoped observations and scheduler configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationInspectionState'}
        '400': {description: Invalid publication cursor}
        '401': {description: Authentication required}
        '403': {description: Active office membership required}
        '503': {description: Stored evidence unavailable}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operations/reconciliation:
    get:
      tags: [Operations]
      operationId: readScopedReceiptAudits
      summary: Read durable receipt audits for the current identity and client scope
      description: Reads one authorized PostgreSQL snapshot. Scope is recalculated from active office membership and current client access. Earlier reports are hidden when that scope changes. The latest report is independent of the history cursor. Responses use Cache-Control no-store.
      parameters:
        - name: beforeRevision
          in: query
          schema: {type: integer, minimum: 1, maximum: 2147483647}
      responses:
        '200':
          description: Current scope, latest immutable report and up to 20 history entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptAuditState'}
        '400': {description: Invalid history cursor}
        '401': {description: Authentication required}
        '403': {description: Active named office membership required}
        '503': {description: Durable evidence unavailable; no cached report is returned}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operations/reconciliation/run:
    post:
      tags: [Operations]
      operationId: recordScopedReceiptAudit
      summary: Record a named immutable audit of stored publication receipts
      description: The action, current scope and expected predecessor are checked in one serializable transaction with source reads and the append. Idempotency-Key must equal actionId. An exact retry returns the original result, including after a restart or later audit. Current-revision manifests are compared with verified Drive receipts and observed Sheet row hashes. Pending tasks are not counted as consistent deliveries. No external service is read, no provider is called and nothing is repaired. Responses use Cache-Control no-store.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReceiptAuditAction'}
      responses:
        '201':
          description: New audit recorded; replayed is false
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptAuditResult'}
        '200':
          description: Exact stored result recovered; replayed is true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptAuditResult'}
        '400': {description: Invalid action or header does not match actionId}
        '401': {description: Authentication required}
        '403': {description: Current named office membership and CSRF protection required}
        '409': {description: Scope or predecessor changed, action identity conflict, or concurrent audit; retry only the original saved action}
        '422': {description: Caller-supplied receipt rows, drift simulation and automatic repair are refused}
        '503': {description: Outcome unconfirmed; retain the exact saved action for recovery}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operations/slo:
    get:
      tags: [Operations]
      operationId: readOfficeReliabilityEvidence
      summary: Read the monthly availability target and current measurement status
      description: Reads scoped immutable sampled-readiness observations. No configured collector returns explicit unmeasured v1; a configured collector returns v2 with coverage and uncertainty bounds. Compliance requires a completed fully observed month. Probe latency is not complete user-journey latency. Cache-Control is no-store.
      parameters:
        - in: query
          name: month
          required: false
          schema: {type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$'}
          description: Asia/Baghdad month; defaults to current month. Future months are refused.
      responses:
        '200':
          description: Unmeasured status or independently recorded sampled readiness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationsReliabilityReport'}
        '401': {description: Authentication required}
  /v1/monitoring/availability/probe:
    get:
      tags: [Operations]
      operationId: probeOfficeReadiness
      security: [{availabilityMonitor: []}]
      summary: Read scoped storage and worker readiness without creating office work
      description: Dedicated monitor credential only. Storage witness always rolls back. No provider calls or client content. Replies bind the fresh nonce and use Cache-Control no-store.
      parameters:
        - in: header
          name: X-Hawa-Probe-Nonce
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Storage, workflow registration and an active worker are ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailabilityReadiness'}
        '400': {description: Missing or invalid nonce}
        '401': {description: Distinct monitor authentication required; office cookies and credentials are refused}
        '503':
          description: One or more required checks failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailabilityReadiness'}
  /v1/monitoring/availability/observations:
    post:
      tags: [Operations]
      operationId: appendAvailabilityObservation
      security: [{availabilityMonitor: []}]
      summary: Append or replay one immutable independent observation
      description: Original collector UUID, minute and configured target must match. Body maximum 8192 bytes. Exact replay returns the original receipt. Changed content or a competing identity for one slot conflicts. No office actions or provider calls. Retain the original spool record on any unconfirmed outcome.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
          description: Must match observationId exactly
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AvailabilityObservation'}
      responses:
        '201':
          description: Observation appended
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailabilityObservationReceipt'}
        '200':
          description: Original immutable observation replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailabilityObservationReceipt'}
        '400': {description: Invalid observation, identity, clock or retention window}
        '401': {description: Dedicated configured monitor credential required}
        '409': {description: Conflicting observation, slot or configured monitor scope}
        '413': {description: Body exceeds 8192 bytes}
        '503': {description: Outcome unconfirmed; retain and retry the exact saved observation}
  /v1/operations/slo/run:
    post:
      tags: [Operations]
      operationId: retiredSyntheticOperationalProbe
      deprecated: true
      summary: Retired synthetic operational execution
      responses:
        '410': {description: Synthetic benchmarks remain in testkit and cannot execute through Operations}
        '401': {description: Authentication required}
  /v1/clients/budgets:
    get:
      tags: [Operations]
      operationId: retiredMonthlyBudgets
      deprecated: true
      responses:
        '410': {description: Use /v1/spending/policy and /v1/spending/calls; seeded monthly balances are not billing records}
        '401': {description: Authentication required}
  /v1/clients/{clientId}/budget:
    get:
      tags: [Operations]
      operationId: retiredMonthlyClientBudget
      deprecated: true
      parameters:
        - name: clientId
          in: path
          required: true
          schema: {type: string}
      responses:
        '410': {description: Use /v1/spending/policy for authoritative daily limits}
        '401': {description: Authentication required}
  /v1/clients/{clientId}/budget/allocate:
    post:
      tags: [Operations]
      operationId: retiredMonthlyBudgetAllocation
      deprecated: true
      parameters:
        - name: clientId
          in: path
          required: true
          schema: {type: string}
      responses:
        '410': {description: No local governor mutation; use the named audited /v1/spending/policy action}
        '401': {description: Authentication required}
  /v1/tasks/{taskId}/canva/studio:
    get:
      tags: [Designs]
      operationId: latestStudioRun
      summary: Find the latest saved Studio run without starting generation
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Current task-scoped run identity, or null when none exists
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId: {type: [string, 'null'], format: uuid}
                  status: {type: [string, 'null']}
        '404': {description: Task unavailable in the caller's scope}
  /v1/tasks/{taskId}/canva/studio/{runId}:
    get:
      tags: [Designs]
      operationId: readStudioRunEvidence
      summary: Read saved Studio evidence and cumulative budget accounting
      description: Budget admission counts all run calls, including parity after transfer, and reserves conservative request estimates before transport. Shared daily limits aggregate Studio, evaluation and retained-voice calls. Original snapshots and settlement evidence remain distinct. These are operating estimates, not guaranteed invoice ceilings.
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Run, candidates, judgments and sanitized call receipts
          content:
            application/json:
              schema:
                type: object
                required: [run, candidates, judgments, calls]
                properties:
                  run:
                    type: object
                    required: [id, taskId, status, budget, budgetUsage]
                    properties:
                      id: {type: string, format: uuid}
                      taskId: {type: string, format: uuid}
                      status: {type: string}
                      budget: {type: object, description: Original saved budget snapshot}
                      budgetUsage:
                        type: [object, 'null']
                        properties:
                          maxUsd: {type: [number, 'null']}
                          maxCalls: {type: [integer, 'null']}
                          admittedCalls: {type: integer, minimum: 0}
                          knownUsdEstimate: {type: number, minimum: 0}
                          attestedAdditionalUsd: {type: number, minimum: 0}
                          accountedUsd: {type: [number, 'null'], description: Amount used for admission; incomplete while unresolved calls remain}
                          reservedAdditionalUsd: {type: number, minimum: 0}
                          committedUsd: {type: [number, 'null']}
                          remainingUsd: {type: [number, 'null']}
                          daily:
                            oneOf:
                              - {$ref: '#/components/schemas/SharedDailySpending'}
                              - {type: 'null'}
                          unresolvedCalls: {type: integer, minimum: 0}
                          blocker: {type: [string, 'null'], enum: [STUDIO_BUDGET_INVALID, STUDIO_BUDGET_HISTORY_INCOMPLETE, STUDIO_BUDGET_RESERVATION_EXCEEDED, BUDGET_EXHAUSTED, null]}
                  candidates: {type: array, items: {type: object}}
                  judgments: {type: array, items: {type: object}}
                  calls: {type: array, items: {type: object}}
        '404': {description: Run unavailable in the caller's task and tenant scope}
  /v1/tasks/{taskId}/pause:
    $ref: './task-controls.openapi.json#/paths/~1v1~1tasks~1{taskId}~1pause'
  /v1/tasks/{taskId}/resume:
    $ref: './task-controls.openapi.json#/paths/~1v1~1tasks~1{taskId}~1resume'
  /v1/tasks/{taskId}/cancel:
    $ref: './task-controls.openapi.json#/paths/~1v1~1tasks~1{taskId}~1cancel'
  /v1/tasks/{taskId}/retry:
    $ref: './task-controls.openapi.json#/paths/~1v1~1tasks~1{taskId}~1retry'
  /v1/tasks/{taskId}/canva/generate:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1generate'
  /v1/tasks/{taskId}/canva/plans:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1plans'
  /v1/tasks/{taskId}/canva/plans/{operationId}/resume:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1plans~1{operationId}~1resume'
  /v1/tasks/{taskId}/canva/imports/{operationId}/resume:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1imports~1{operationId}~1resume'
  /v1/integrations/canva/status:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1integrations~1canva~1status'
  /v1/integrations/canva/authorize:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1integrations~1canva~1authorize'
  /v1/integrations/canva/callback:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1integrations~1canva~1callback'
  /v1/integrations/canva/disconnect:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1integrations~1canva~1disconnect'
  /v1/tasks/{taskId}/canva:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva'
  /v1/tasks/{taskId}/canva/amendment-observation:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1amendment-observation'
  /v1/tasks/{taskId}/canva/editor:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1editor'
  /v1/tasks/{taskId}/canva-binding:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva-binding'
  /v1/tasks/{taskId}/native-review:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1native-review'
  /v1/tasks/{taskId}/canva/revision-copy:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1revision-copy'
  /v1/tasks/{taskId}/canva/design:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1design'
  /v1/tasks/{taskId}/canva/exports:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1exports'
  /v1/tasks/{taskId}/canva/exports/{operationId}/resume:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1exports~1{operationId}~1resume'
  /v1/tasks/{taskId}/canva/artifacts/{artifactId}:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1artifacts~1{artifactId}'
  /v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      description: >-
        One page of the tasks the caller may see, newest first (created_at, then id). Pass a page's
        nextCursor back as `cursor` for the next, older page; `total` counts every task the filter
        matches. List rows carry no preview, intake JSON or image bytes: GET /v1/tasks/{taskId} does.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: statuses
          in: query
          description: Comma-separated API statuses (TaskStatus); a task matches when the list would show it with one of them. A word that is not one matches nothing.
          schema: {type: string}
        - name: status
          in: query
          description: One API status or database state (older callers); any other word is a 400. Prefer statuses.
          schema: {oneOf: [{$ref: '#/components/schemas/TaskStatus'}, {$ref: '#/components/schemas/TaskState'}]}
        - name: q
          in: query
          description: Text to find in the title, description, client name or task id (Arabic-keyboard ي/ى and ك match Sorani ی and ک).
          schema: {type: string, maxLength: 200}
        - name: clientId
          in: query
          schema: {type: string, format: uuid}
        - name: offset
          in: query
          deprecated: true
          description: Rows to skip (older callers). Ignored when cursor is sent.
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Authorized task page
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, nextCursor]
                properties:
                  items: {type: array, items: {$ref: '../schemas/Task.schema.json'}}
                  total: {type: integer, minimum: 0}
                  limit: {type: integer, minimum: 1, maximum: 200}
                  offset: {type: integer, minimum: 0}
                  nextCursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Tasks]
      operationId: createTask
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, description]
              properties:
                clientId: {type: [string, 'null'], format: uuid}
                projectId: {type: [string, 'null'], format: uuid}
                title: {type: string, minLength: 1, maxLength: 500}
                description: {type: string, maxLength: 100000}
                exactCopy: {type: array, items: {type: string}}
                language: {type: [string, 'null']}
                direction: {enum: [ltr, rtl, auto]}
                dueAt: {type: [string, 'null'], format: date-time}
                priority: {oneOf: [{type: integer, minimum: 1, maximum: 5}, {enum: [routine, rush, urgent]}]}
                attachmentIds: {type: array, items: {type: string, format: uuid}}
                workflow: {type: string, enum: [canva_manual]}
                copyEn: {type: string, maxLength: 20000}
                copyCkb: {type: string, maxLength: 20000}
                designInstructions: {type: string, maxLength: 4000}
                referenceAssets: {type: string}
                source: {type: object}
                sourceDocument: {$ref: '#/components/schemas/DocumentConfirmation'}
              allOf:
                - if: {required: [sourceDocument]}
                  then:
                    required: [workflow, clientId, copyEn, copyCkb, designInstructions]
                    properties:
                      workflow: {const: canva_manual}
                      title: {type: string, minLength: 1, maxLength: 200}
                    description: Requires an authenticated office operator/administrator, explicit Idempotency-Key and nonblank exact copy in at least one language. Checks retained PDF bytes and receipt hashes atomically with task/event/outbox. Exact retries reuse the first task; changed payload with the same key conflicts.

      responses:
        '201':
          description: Task created
          content: {application/json: {schema: {$ref: '../schemas/Task.schema.json'}}}
        default: {$ref: '#/components/responses/Problem'}
