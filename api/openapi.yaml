openapi: 3.1.0
info:
  title: Hawa Creative OS API
  version: 1.0.0
  description: Private office API. Mutating requests require authentication, authorization, and Idempotency-Key.
servers:
  - url: https://hawa.local/api
security:
  - oidc: []
tags:
  - name: Tasks
  - name: Messages
  - name: Designs
  - name: Clients
  - name: Operations
  - name: Evaluations
  - name: Integrations
paths:
  /v1/tasks/{taskId}/canva/generate:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1generate'
  /v1/tasks/{taskId}/canva/plans:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1plans'
  /v1/tasks/{taskId}/canva/plans/{operationId}/resume:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1plans~1{operationId}~1resume'
  /v1/tasks/{taskId}/canva/imports/{operationId}/resume:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1imports~1{operationId}~1resume'
  /v1/integrations/canva/status:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1integrations~1canva~1status'
  /v1/integrations/canva/authorize:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1integrations~1canva~1authorize'
  /v1/integrations/canva/callback:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1integrations~1canva~1callback'
  /v1/integrations/canva/disconnect:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1integrations~1canva~1disconnect'
  /v1/tasks/{taskId}/canva:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva'
  /v1/tasks/{taskId}/canva/editor:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1editor'
  /v1/tasks/{taskId}/canva/design:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1design'
  /v1/tasks/{taskId}/canva/exports:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1exports'
  /v1/tasks/{taskId}/canva/exports/{operationId}/resume:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1exports~1{operationId}~1resume'
  /v1/tasks/{taskId}/canva/artifacts/{artifactId}:
    $ref: './canva-connect.openapi.json#/paths/~1v1~1tasks~1{taskId}~1canva~1artifacts~1{artifactId}'
  /v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      description: >-
        One page of the tasks the caller may see, newest first (created_at, then id). Pass a page's
        nextCursor back as `cursor` for the next, older page; `total` counts every task the filter
        matches. List rows carry no preview, intake JSON or image bytes: GET /v1/tasks/{taskId} does.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: statuses
          in: query
          description: Comma-separated API statuses (TaskStatus); a task matches when the list would show it with one of them. A word that is not one matches nothing.
          schema: {type: string}
        - name: status
          in: query
          description: One API status or database state (older callers); any other word is a 400. Prefer statuses.
          schema: {oneOf: [{$ref: '#/components/schemas/TaskStatus'}, {$ref: '#/components/schemas/TaskState'}]}
        - name: q
          in: query
          description: Text to find in the title, description, client name or task id (Arabic-keyboard ي/ى and ك match Sorani ی and ک).
          schema: {type: string, maxLength: 200}
        - name: clientId
          in: query
          schema: {type: string, format: uuid}
        - name: offset
          in: query
          deprecated: true
          description: Rows to skip (older callers). Ignored when cursor is sent.
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Authorized task page
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, nextCursor]
                properties:
                  items: {type: array, items: {$ref: '../schemas/Task.schema.json'}}
                  total: {type: integer, minimum: 0}
                  limit: {type: integer, minimum: 1, maximum: 200}
                  offset: {type: integer, minimum: 0}
                  nextCursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Tasks]
      operationId: createTask
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, description]
              properties:
                clientId: {type: [string, 'null'], format: uuid}
                projectId: {type: [string, 'null'], format: uuid}
                title: {type: string, minLength: 1, maxLength: 500}
                description: {type: string, maxLength: 100000}
                exactCopy: {type: array, items: {type: string}}
                language: {type: [string, 'null']}
                direction: {enum: [ltr, rtl, auto]}
                dueAt: {type: [string, 'null'], format: date-time}
                priority: {oneOf: [{type: integer, minimum: 1, maximum: 5}, {enum: [routine, rush, urgent]}]}
                attachmentIds: {type: array, items: {type: string, format: uuid}}
                workflow: {type: string, enum: [canva_manual]}
                copyEn: {type: string, maxLength: 20000}
                copyCkb: {type: string, maxLength: 20000}
                designInstructions: {type: string, maxLength: 4000}
                referenceAssets: {type: string}
                source: {type: object}
                sourceDocument: {$ref: '#/components/schemas/DocumentConfirmation'}
              allOf:
                - if: {required: [sourceDocument]}
                  then:
                    required: [workflow, clientId, copyEn, copyCkb, designInstructions]
                    properties:
                      workflow: {const: canva_manual}
                      title: {type: string, minLength: 1, maxLength: 200}
                    description: Requires an authenticated office operator/administrator, explicit Idempotency-Key and nonblank exact copy in at least one language. Checks retained PDF bytes and receipt hashes atomically with task/event/outbox. Exact retries reuse the first task; changed payload with the same key conflicts.

      responses:
        '201':
          description: Task created
          content: {application/json: {schema: {$ref: '../schemas/Task.schema.json'}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}:
    get:
      tags: [Tasks]
      operationId: getTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200': {description: Task, content: {application/json: {schema: {$ref: '../schemas/Task.schema.json'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/timeline:
    get:
      tags: [Tasks]
      operationId: getTaskTimeline
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Ordered immutable task events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: {type: array, items: {$ref: '#/components/schemas/DomainEvent'}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/messages/{messageId}/promote:
    post:
      tags: [Messages]
      operationId: promoteMessage
      parameters:
        - {$ref: '#/components/parameters/MessageId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                clientId: {type: [string, 'null'], format: uuid}
                projectId: {type: [string, 'null'], format: uuid}
                title: {type: [string, 'null']}
      responses:
        '201': {description: Promoted task, content: {application/json: {schema: {$ref: '../schemas/Task.schema.json'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/route:
    post:
      tags: [Tasks]
      operationId: routeTask
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatchVersion'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId, reason]
              properties:
                clientId: {type: string, format: uuid}
                projectId: {type: [string, 'null'], format: uuid}
                reason: {type: string, minLength: 1}
      responses:
        '202': {description: Routing command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/briefs:
    post:
      tags: [Tasks]
      operationId: createOrApproveBrief
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '../schemas/DesignBrief.schema.json'}}}
      responses:
        '201': {description: Brief revision created, content: {application/json: {schema: {$ref: '../schemas/DesignBrief.schema.json'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/generate:
    post:
      tags: [Designs]
      operationId: startGeneration
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                routeOverride: {type: [string, 'null']}
                directionCount: {type: integer, minimum: 1, maximum: 3, default: 1}
                maxCostUsd: {type: number, minimum: 0}
      responses:
        '202': {description: Durable generation started, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/{control}:
    post:
      tags: [Operations]
      operationId: controlTaskWorkflow
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - name: control
          in: path
          required: true
          schema: {enum: [pause, resume, cancel, replay]}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1}
                checkpoint: {type: [string, 'null']}
                fallbackDeploymentId: {type: [string, 'null'], format: uuid}
      responses:
        '202': {description: Control command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/designs/{designId}/revisions:
    get:
      tags: [Designs]
      operationId: listDesignRevisions
      parameters:
        - name: designId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/DesignRevision'}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/revisions/{revisionId}/qa:
    post:
      tags: [Designs]
      operationId: runQA
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/RevisionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {description: QA started, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/revisions/{revisionId}/decisions:
    post:
      tags: [Designs]
      operationId: decideReview
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/RevisionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '../schemas/ApprovalDecision.schema.json'}}}
      responses:
        '201': {description: Decision recorded, content: {application/json: {schema: {$ref: '../schemas/ApprovalDecision.schema.json'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/publish:
    post:
      tags: [Tasks]
      operationId: publishTask
      description: Request-owned tasks require an authorized office reviewer, a UUID Idempotency-Key, and the current approvalId. The action starts a versioned delivery; completion is reported only after archive, Sheet row, and requester send are confirmed.
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: A retried request-owned action has completed or requires an explicit new delivery action after archive failure}
        '202': {description: Publication started, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/requester-send-evidence:
    get:
      tags: [Tasks]
      operationId: getRequesterSendEvidence
      description: Office-only local TelegramSender marks for the current unresolved request-owned publication. A Bot API message ID is not a requester read receipt.
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Approved file and notice marks, exact send keys and local provider message IDs.
          content: {application/json: {schema: {$ref: '#/components/schemas/RequesterSendEvidence'}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/requester-send-confirmation:
    post:
      tags: [Tasks]
      operationId: confirmRequesterSendVisible
      description: Office administrator attests that every approved file and notice is visible in the exact requester chat. This does not send, replay or prove a requester read receipt.
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RequesterSendConfirmation'}}}
      responses:
        '200': {description: Staff-visible confirmation committed with one request revision}
        default: {$ref: '#/components/responses/Problem'}
  /v1/tasks/{taskId}/feedback:
    post:
      tags: [Tasks]
      operationId: recordFeedback
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '../schemas/FeedbackEvent.schema.json'}}}
      responses:
        '201': {description: Feedback recorded, content: {application/json: {schema: {$ref: '../schemas/FeedbackEvent.schema.json'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/dna:
    get:
      tags: [Clients]
      operationId: getClientDNA
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - name: version
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '200': {description: Client DNA, content: {application/json: {schema: {$ref: '../schemas/ClientDNA.schema.json'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Clients]
      operationId: createClientDNAVersion
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '../schemas/ClientDNA.schema.json'}}}
      responses:
        '201': {description: Draft DNA version created, content: {application/json: {schema: {$ref: '../schemas/ClientDNA.schema.json'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/documents:
    post:
      tags: [Clients]
      operationId: saveClientPdf
      summary: Retain an original PDF and its native extraction for an explicit Desk request
      description: Active writable client required. Source bytes are content-addressed; client/source hash/extractor version replays reuse an immutable receipt. Never indexes knowledge, creates a task or approves a design. Requires local blob storage and, for new sources, the isolated PDF parser. Limits match inspection.
      parameters: [{$ref: '#/components/parameters/ClientId'}]
      requestBody:
        required: true
        content: {application/pdf: {schema: {type: string, format: binary}}}
      responses:
        '201': {description: Original bytes and extraction retained, content: {application/json: {schema: {$ref: '#/components/schemas/SavedClientDocument'}}}}
        '200': {description: Existing retained receipt reused, content: {application/json: {schema: {$ref: '#/components/schemas/SavedClientDocument'}}}}
        default: {$ref: '#/components/responses/Problem'}
    get:
      tags: [Clients]
      operationId: listClientPdfs
      summary: List the latest 20 saved PDF receipts in authorized client scope
      parameters: [{$ref: '#/components/parameters/ClientId'}]
      responses:
        '200': {description: Recent receipts without extraction bodies, content: {application/json: {schema: {type: object, properties: {items: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/ClientDocumentReceipt'}}}}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/documents/{documentId}:
    get:
      tags: [Clients]
      operationId: getClientPdf
      summary: Reopen retained extraction and capability limits
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Saved source receipt and extraction, content: {application/json: {schema: {$ref: '#/components/schemas/SavedClientDocument'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/documents/{documentId}/content:
    get:
      tags: [Clients]
      operationId: downloadClientPdf
      summary: Download hash-verified original bytes after client authorization
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Original PDF attachment with private no-store caching, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '404': {description: Receipt outside authorized client scope or unavailable}
        '503': {description: File store unavailable or original bytes missing or corrupt}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/documents/{documentId}/knowledge:
    get:
      tags: [Clients]
      operationId: getDocumentKnowledgeApproval
      summary: Read current reference-search approval and latest 20 audit events
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Current version and current named-manager capability, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentKnowledgeState'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Clients]
      operationId: changeDocumentKnowledgeApproval
      summary: Approve or revoke this exact PDF for client reference search
      description: Requires live named Google office administrator or scoped client DNA manager authority. New approval verifies original bytes and derives immutable chunks from the saved extraction. Expected version and UUID action identity serialize concurrent decisions. Replay requires current authority and returns the original action plus current state; it never restores an old approval. Revocation and replay do not require source bytes. No DNA rule, final copy, model input or design approval is created. Upload limit 8 KiB and 5 seconds.
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DocumentKnowledgeChange'}}}
      responses:
        '201': {description: Immutable action and index transaction committed, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentKnowledgeState'}}}}
        '200': {description: Original action replayed with current state, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentKnowledgeState'}}}}
        '409': {description: Stale version, changed source hashes, inactive client or reused action identity}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/knowledge/search:
    get:
      tags: [Clients]
      operationId: searchApprovedClientDocuments
      summary: Search approved retained PDF passages in an active authorized client
      description: PostgreSQL normalized exact substring, simple full-text and trigram search. Tenant, client and latest approval are filtered in a materialized relation before ranking. Up to 10 passages, 2000 original characters each, with immutable source, chunk, page and approval citations. No vector, reranker or automatic model context. Private no-store; results represent the query snapshot. Queries have a 3-second database timeout.
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}, description: At most 50 whitespace-separated words; at least one letter or numeral.}
      responses:
        '200': {description: Scoped lexical results with original text and citations, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentKnowledgeSearch'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/clients/{clientId}/documents/inspect:
    post:
      tags: [Clients]
      operationId: inspectClientPdf
      summary: Preview native PDF text locally without saving or approving it
      description: Requires active client access before and after extraction. Limits are 20 MiB and 40 pages. OCR, semantic reading order, tables and images are not extracted. Partial or textless-page results are refused.
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
      requestBody:
        required: true
        content:
          application/pdf:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Unsaved, unapproved text preview with original source hash and measured page coordinates
          content:
            application/json:
              schema:
                type: object
                required: [clientId, sourceSaved, approved, document]
                properties:
                  clientId: {type: string, format: uuid}
                  sourceSaved: {type: boolean, const: false}
                  approved: {type: boolean, const: false}
                  document: {type: object, description: 'Source SHA-256, stable chunks with text/page/coordinates, and extractor version/capability limitations.'}
        '404': {description: Client unavailable or unauthorized}
        '408': {description: Upload deadline exceeded}
        '413': {description: Input size limit exceeded}
        '422': {description: Unsupported, partial, textless or invalid PDF extraction}
        '503': {description: Local parser or authorization store unavailable}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operations/failures:
    get:
      tags: [Operations]
      operationId: listFailures
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Actionable failures
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/FailureItem'}}
                  nextCursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
  /v1/integrations/health:
    get:
      tags: [Integrations]
      operationId: getIntegrationHealth
      responses:
        '200':
          description: Integration health
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [integrationId, kind, state, checkedAt]
                      properties:
                        integrationId: {type: string, format: uuid}
                        kind: {type: string}
                        state: {enum: [healthy, degraded, unavailable, disabled, reauth_required, unknown]}
                        checkedAt: {type: string, format: date-time}
                        detail: {type: object}
        default: {$ref: '#/components/responses/Problem'}
  /v1/evaluations/runs:
    post:
      tags: [Evaluations]
      operationId: startEvaluation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [datasetId, candidate]
              properties:
                datasetId: {type: string, format: uuid}
                candidate: {type: object}
                blindReview: {type: boolean, default: true}
      responses:
        '202': {description: Evaluation started, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/evaluations/runs/{runId}:
    get:
      tags: [Evaluations]
      operationId: getEvaluationRun
      parameters:
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Evaluation run
          content:
            application/json:
              schema:
                type: object
                required: [id, status, candidate, summary]
                properties:
                  id: {type: string, format: uuid}
                  status: {enum: [queued, running, completed, failed, cancelled]}
                  candidate: {type: object}
                  summary: {type: object}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    officeBearer:
      $ref: './canva-connect.openapi.json#/components/securitySchemes/officeBearer'
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://accounts.google.com/.well-known/openid-configuration
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MessageId:
      name: messageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClientId:
      name: clientId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 200}
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      schema: {type: integer, minimum: 1}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    Problem:
      description: RFC 9457-style problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    DocumentConfirmation:
      type: object
      required: [id, sourceSha256, extractionSha256, confirmed]
      properties:
        id: {type: string, format: uuid}
        sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        extractionSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        confirmed: {const: true, description: Human reviewed the chosen exact request copy against the original. This is not design or knowledge approval.}
    ClientDocumentReceipt:
      type: object
      required: [id, clientId, sourceSha256, extractionSha256, extractorVersion, createdAt, contentUrl]
      properties:
        id: {type: string, format: uuid}
        clientId: {type: string, format: uuid}
        sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        extractionSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        extractorVersion: {type: string}
        createdAt: {type: string, format: date-time}
        contentUrl: {type: string}
    SavedClientDocument:
      type: object
      required: [clientId, sourceSaved, approved, receipt, document]
      properties:
        clientId: {type: string, format: uuid}
        sourceSaved: {const: true}
        approved: {const: false, description: Retention itself grants no approval. Read the separate knowledge endpoint for current reference approval.}
        receipt: {$ref: '#/components/schemas/ClientDocumentReceipt'}
        document: {type: object, description: Immutable source-byte SHA-256, chunks with measured page provenance and extractor capability limits.}
    DocumentKnowledgeChange:
      type: object
      required: [approved, expectedVersion, sourceSha256, extractionSha256, reviewed, reason]
      properties:
        approved: {type: boolean}
        expectedVersion: {type: integer, minimum: 0, maximum: 2147483646}
        sourceSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        extractionSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        reviewed: {type: boolean, description: Must be true for approval; revocation does not require source review.}
        reason: {type: string, minLength: 1, maxLength: 1000}
    DocumentKnowledgeEvent:
      type: object
      required: [actionId, version, approved, actorUserId, actorDisplayName, reason, createdAt]
      properties:
        actionId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        approved: {type: boolean}
        actorUserId: {type: string, format: uuid}
        actorDisplayName: {type: string}
        reason: {type: string}
        createdAt: {type: string, format: date-time}
    DocumentKnowledgeState:
      type: object
      required: [state, events, canManage]
      properties:
        state: {type: object, required: [version, approved], properties: {version: {type: integer, minimum: 0}, approved: {type: boolean}}}
        events: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/DocumentKnowledgeEvent'}}
        canManage: {type: boolean}
        replayed: {type: boolean}
        action: {$ref: '#/components/schemas/DocumentKnowledgeEvent'}
    DocumentKnowledgeSearch:
      type: object
      required: [clientId, mode, vectorStatus, rerankerStatus, items]
      properties:
        clientId: {type: string, format: uuid}
        mode: {const: postgres_lexical_v1}
        vectorStatus: {const: not_run}
        rerankerStatus: {const: not_run}
        items:
          type: array
          maxItems: 10
          items:
            type: object
            required: [text, truncated, score, citation]
            properties:
              text: {type: string, maxLength: 2000}
              truncated: {type: boolean}
              score: {type: number, description: Lexical heuristic; not a calibrated relevance probability.}
              citation:
                type: object
                required: [documentId, chunkId, pageNumber, chunkSha256, sourceSha256, extractionSha256, extractorVersion, approvalVersion, approvalActionId]
                properties:
                  documentId: {type: string, format: uuid}
                  chunkId: {type: string, format: uuid}
                  pageNumber: {type: [integer, 'null']}
                  chunkSha256: {type: string}
                  sourceSha256: {type: string}
                  extractionSha256: {type: string}
                  extractorVersion: {type: string}
                  approvalVersion: {type: integer, minimum: 1}
                  approvalActionId: {type: string, format: uuid}
                  coordinates:
                    type: [object, 'null']
                    description: Measured top-left page box in points, preserved from the PDF parser.
                    required: [x, y, width, height]
                    properties:
                      x: {type: number, minimum: 0}
                      y: {type: number, minimum: 0}
                      width: {type: number, exclusiveMinimum: 0}
                      height: {type: number, exclusiveMinimum: 0}
                  coordinateSystem: {type: [string, 'null']}
    Problem:
      type: object
      required: [type, title, status, code, detail, safe_action]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        safe_action: {type: string}
        trace_id: {type: [string, 'null']}
        errors: {type: array, items: {type: object}}
    CommandReceipt:
      type: object
      required: [commandId, taskId, acceptedAt]
      properties:
        commandId: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        workflowId: {type: [string, 'null']}
        acceptedAt: {type: string, format: date-time}
    DomainEvent:
      type: object
      required: [event_id, event_type, schema_version, occurred_at, tenant_id, aggregate_type, aggregate_id, aggregate_version, actor, correlation_id, data]
      properties:
        event_id: {type: string, format: uuid}
        event_type: {type: string}
        schema_version: {type: integer, minimum: 1}
        occurred_at: {type: string, format: date-time}
        tenant_id: {type: string, format: uuid}
        client_id: {type: [string, 'null'], format: uuid}
        aggregate_type: {type: string}
        aggregate_id: {type: string, format: uuid}
        aggregate_version: {type: integer, minimum: 1}
        actor: {type: object}
        correlation_id: {type: string, format: uuid}
        causation_id: {type: [string, 'null'], format: uuid}
        trace_id: {type: [string, 'null']}
        data: {type: object}
    DesignRevision:
      type: object
      required: [id, documentId, revision, sourceSha256, semanticHash, studio, studioVersion, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        documentId: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        sourceSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        semanticHash: {type: string}
        studio: {type: string}
        studioVersion: {type: string}
        status: {enum: [draft, review, approved, rejected, superseded]}
        createdAt: {type: string, format: date-time}
    FailureItem:
      type: object
      required: [taskId, state, errorClass, message, safeAction, updatedAt]
      properties:
        taskId: {type: string, format: uuid}
        state: {type: string}
        step: {type: [string, 'null']}
        errorClass: {type: string}
        message: {type: string}
        safeAction: {type: string}
        attempts: {type: integer, minimum: 0}
        traceId: {type: [string, 'null']}
        updatedAt: {type: string, format: date-time}
    RequesterSendStep:
      type: object
      required: [sendKey, outcome, attemptCount, lastMarkAt, messageId]
      properties:
        sendKey: {type: string}
        outcome: {enum: [not_attempted, attempted, sent, uncertain, failed, released]}
        attemptCount: {type: integer, minimum: 0}
        lastMarkAt: {type: [string, 'null'], format: date-time}
        messageId: {type: [string, 'null'], pattern: '^[1-9][0-9]*$'}
    RequesterSendEvidence:
      type: object
      required: [taskId, requestId, requestRev, publicationId, approvalId, requesterChatId, providerReceipt, files, notice]
      properties:
        taskId: {type: string, format: uuid}
        requestId: {type: string, format: uuid}
        requestRev: {type: integer, minimum: 1}
        publicationId: {type: string, format: uuid}
        approvalId: {type: string, format: uuid}
        requesterChatId: {type: [string, 'null']}
        providerReceipt: {const: not_available}
        files:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/RequesterSendStep'}
              - {type: object, required: [artifactId, filename, sha256], properties: {artifactId: {type: string, format: uuid}, filename: {type: string}, sha256: {type: string, pattern: '^[a-f0-9]{64}$'}}}
        notice: {$ref: '#/components/schemas/RequesterSendStep'}
    RequesterSendConfirmation:
      type: object
      required: [actionId, expectedRev, publicationId, approvalId, requesterChatId, observed, attested]
      additionalProperties: false
      properties:
        actionId: {type: string, format: uuid}
        expectedRev: {type: integer, minimum: 5}
        publicationId: {type: string, format: uuid}
        approvalId: {type: string, format: uuid}
        requesterChatId: {type: string, minLength: 1}
        observed:
          type: array
          minItems: 2
          items:
            type: object
            required: [sendKey, messageId]
            additionalProperties: false
            properties:
              sendKey: {type: string}
              messageId: {type: string, pattern: '^[1-9][0-9]*$'}
        attested: {const: true}
    # BEGIN GENERATED task status: scripts/generate_task_status_contract.ts from packages/contracts/src/task-status.ts. Do not edit.
