# The chaos suite's own stack (PHASE2_DESIGN.md section 6.1): Postgres, Restate 1.7.10, Core, the
# blue and green workers and the fakes, built from this checkout's Dockerfiles.
#
# It shares nothing with the office's projects: its own project name (hawa-chaos), volumes, networks
# and images (hawa-chaos-*:local); host ports only on 127.0.0.1, all above 56000. Start it through
# the driver (README.md), which writes the throwaway secrets this file reads into .run/chaos.env.
#
# Core and the workers are on the `chaos` network only, which is internal: they cannot reach the
# internet at all. The provider hosts written into the code (api.telegram.org, api.openai.com, …)
# are network aliases of the fakes container there, and the fakes' CA is trusted through
# NODE_EXTRA_CA_CERTS, so the real URL code runs unchanged and every call lands in the fakes. A host
# nobody faked does not resolve: no request can become a paid call by accident.
name: hawa-chaos

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://hawa_app_a:${CHAOS_APP_PASSWORD:?run the chaos driver, which writes .run/chaos.env}@postgres:5432/hawa_chaos
  RESTATE_INGRESS_URL: http://restate:8080
  RESTATE_ADMIN_URL: http://restate:9070
  HAWA_CORE_INTERNAL_URL: http://core:3001
  # The worker's own credential for Core's /v1/internal/* endpoints (a service principal).
  HAWA_WORKER_TOKEN: ${CHAOS_WORKER_TOKEN:?}
  # The chats whose requests Restate's lifecycle runs (Phase 2 slices; 2.2: the Delivery workflow).
  # The driver's flagged scenarios use these chats; every other chat takes the legacy path.
  HAWA_LIFECYCLE_CHATS: "9300001,9300002,9300003,9300004,9300005,9300006,9300007,9300008,9300009,9300010,9300011,9300012"
  HAWA_BEARER_TOKEN: ${CHAOS_BEARER_TOKEN:?}
  HAWA_ART_DIRECTOR_KEY: ${CHAOS_REVIEWER_KEY:?}
  HAWA_ADMIN_KEY: ${CHAOS_ADMIN_KEY:?}
  HAWA_ACTION_HMAC_SECRET: ${CHAOS_HMAC_SECRET:?}
  TELEGRAM_BOT_TOKEN: ${CHAOS_BOT_TOKEN:?}
  TELEGRAM_WEBHOOK_SECRET: ${CHAOS_WEBHOOK_SECRET:?}
  # The office (director) chat, and the requesters the scripted requests come from.
  TELEGRAM_ALLOWED_USERS: "9000001"
  TELEGRAM_INTAKE_ALLOWED_USERS: "9100001,9100002,9100003"
  # Provider keys are placeholders: every provider host is the fakes container.
  OPENAI_API_KEY: chaos-not-a-real-key
  GEMINI_API_KEY: chaos-not-a-real-key
  ANTHROPIC_API_KEY: chaos-not-a-real-key
  CANVA_BASE_URL: http://fakes:9000/canva/rest/v1
  CANVA_CLIENT_ID: chaos-canva-client
  CANVA_CLIENT_SECRET: ${CHAOS_CANVA_SECRET:?}
  CANVA_REDIRECT_URI: http://localhost:3001/v1/integrations/canva/callback
  CANVA_TOKEN_ENCRYPTION_KEY: ${CHAOS_CANVA_KEY:?}
  GOOGLE_DRIVE_API_BASE_URL: http://fakes:9000/google
  GOOGLE_DRIVE_UPLOAD_BASE_URL: http://fakes:9000/google
  GOOGLE_SHEETS_API_BASE_URL: http://fakes:9000/google
  # Written by the fakes into the CA volume; the token request goes to the fake oauth2.googleapis.com.
  GOOGLE_APPLICATION_CREDENTIALS: /chaos-ca/google-service-account.json
  # The legacy path this suite measures today: planner drafts, no studio (fixtures cover no studio stage).
  DESIGN_PIPELINE_V3: "off"
  DESIGN_STUDIO_V2: "off"
  HAWA_DRAFT_REMINDERS: "off"
  # One sender makes every scripted request of a run; the office's ceilings (5 a day) would stop
  # the automatic draft after the fifth. Intake still counts and checks them.
  AUTO_GENERATE_DAILY_CAP_PER_SENDER: "1000"
  AUTO_GENERATE_DAILY_CAP_GLOBAL: "1000"
  HAWA_CHAOS_CONTROL_URL: http://fakes:9000/__chaos
  # Phase 2.1: `core` (default) polls Telegram in Core, as production does today; `worker` (run.ts
  # --poller worker) polls in the live worker colour and hands each update to its chat's ChatInbox,
  # which calls Core's /v1/internal/* with the worker's own token.
  HAWA_TELEGRAM_POLLER: ${CHAOS_TELEGRAM_POLLER:-core}
  NODE_EXTRA_CA_CERTS: /chaos-ca/ca.pem
  HAWA_BUILD_COMMIT: ${CHAOS_BUILD_COMMIT:-unknown}

x-worker: &worker
  build:
    context: ../../..
    dockerfile: infra/docker/Dockerfile.worker
    args:
      HAWA_BUILD_COMMIT: ${CHAOS_BUILD_COMMIT:-unknown}
  image: hawa-chaos-worker:local
  restart: "no"
  logging: *logging
  mem_limit: 384m
  networks: [chaos]
  volumes:
    - chaos_ca:/chaos-ca:ro
  depends_on:
    fakes: { condition: service_healthy }
    postgres: { condition: service_healthy }
    restate: { condition: service_healthy }

services:
  blob-init:
    image: hawa-chaos-core:local
    user: root
    restart: "no"
    logging: *logging
    command: ["sh", "-c", "mkdir -p /var/lib/hawa/blobs/sha256 /var/lib/hawa/blobs/tmp && printf 'sha256-v1\\n' > /var/lib/hawa/blobs/.hawa-blob-store && chown -R 10001:10001 /var/lib/hawa/blobs"]
    volumes:
      - chaos_blobs:/var/lib/hawa/blobs
    networks: [chaos]

  postgres:
    image: pgvector/pgvector:pg17
    restart: "no"
    logging: *logging
    mem_limit: 512m
    shm_size: 128mb
    environment:
      POSTGRES_DB: hawa_chaos
      POSTGRES_USER: hawa_owner
      POSTGRES_PASSWORD: ${CHAOS_OWNER_PASSWORD:?}
      HAWA_APP_DATABASE_URL: postgresql://hawa_app_a:${CHAOS_APP_PASSWORD:?}@postgres:5432/hawa_chaos
      PGDATA: /var/lib/postgresql/data/pgdata
    # fsync off is safe here: the suite kills processes, and the Docker VM (which keeps the page
    # cache) never loses power; it models no power loss. synchronous_commit stays on, as in
    # production: off, a killed Postgres forgets commits it had already acknowledged, and the suite
    # would report losses production cannot have (seen in the first run on 2026-09-24).
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=80", "-c", "fsync=${CHAOS_PG_FSYNC:-off}", "-c", "full_page_writes=${CHAOS_PG_FULL_PAGE_WRITES:-off}"]
    ports:
      - "127.0.0.1:56432:5432"
    volumes:
      - chaos_postgres:/var/lib/postgresql/data
      - ../../../infra/docker/00-init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
      - ../../../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../../db/rls.sql:/docker-entrypoint-initdb.d/02-rls.sql:ro
      # The runtime grants production's init runs. The first runs left this file out, because it
      # revoked UPDATE on hawa.outbox_commands and a worker on such a database could not lease a
      # command ("permission denied for table outbox_commands", 2026-09-24); it now grants the columns
      # the code moves, and every run checks that a database built as production's is works end to end.
      - ../../../db/03-grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
      - ../../../db/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    networks: [chaos, chaos-edge]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawa_owner -d hawa_chaos"]
      interval: 2s
      timeout: 3s
      retries: 60

  restate:
    image: ghcr.io/restatedev/restate:1.7.10
    restart: "no"
    logging: *logging
    mem_limit: 768m
    environment:
      RESTATE_NODE_NAME: hawa-restate-chaos-1
      # The default RocksDB budget is sized for a server; the chaos stack runs beside production.
      RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE: 256 MiB
    ports:
      - "127.0.0.1:56070:9070"
      - "127.0.0.1:56080:8080"
    volumes:
      - chaos_restate:/restate-data
    networks: [chaos, chaos-edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9070/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  fakes:
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile.worker
      # The node base stage only: the fakes use nothing but Node itself.
      target: base
    image: hawa-chaos-fakes:local
    restart: "no"
    logging: *logging
    mem_limit: 256m
    working_dir: /repo/packages/testkit/chaos
    command: ["node", "/repo/packages/testkit/chaos/fakes/server.ts"]
    environment:
      CHAOS_CA_DIR: /chaos-ca
      CHAOS_CORE_URL: http://core:3001
    ports:
      - "127.0.0.1:56090:9000"
    volumes:
      - ./:/repo/packages/testkit/chaos:ro
      - ../../integrations/test/fake-drive-server.ts:/repo/packages/integrations/test/fake-drive-server.ts:ro
      - chaos_ca:/chaos-ca
    networks:
      chaos:
        aliases:
          - api.telegram.org
          - api.openai.com
          - generativelanguage.googleapis.com
          - api.anthropic.com
          - api.canva.com
          - export-download.canva.com
          - document-export.canva.com
          - oauth2.googleapis.com
          - www.googleapis.com
          - sheets.googleapis.com
      chaos-edge: {}
    healthcheck:
      test: ["CMD", "node", "-e", "require('fs').accessSync('/chaos-ca/ca.pem');fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  core:
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile.core
      args:
        HAWA_BUILD_COMMIT: ${CHAOS_BUILD_COMMIT:-unknown}
    image: hawa-chaos-core:local
    restart: "no"
    logging: *logging
    mem_limit: 768m
    environment:
      <<: *app-environment
      PORT: 3001
      HAWA_CHAOS_SERVICE: core
      # Standalone host collector: no scheduled monitor runs unless the qualification driver starts it.
      HAWA_AVAILABILITY_MONITOR_ID: "00000000-0000-4000-a000-000000000104"
      HAWA_AVAILABILITY_TARGET_ORIGIN: http://127.0.0.1:56081
      HAWA_AVAILABILITY_MONITOR_SECRET: ${CHAOS_AVAILABILITY_SECRET:?}
      HAWA_AVAILABILITY_WORKER_URLS: http://worker-blue:9080/health,http://worker-green:9080/health
      HAWA_BLOB_DIR: /var/lib/hawa/blobs
      HAWA_DOCLING_URL: ${CHAOS_DOCLING_URL:-}
    volumes:
      - chaos_ca:/chaos-ca:ro
      - chaos_blobs:/var/lib/hawa/blobs
    networks: [chaos, parser]
    depends_on:
      fakes: { condition: service_healthy }
      postgres: { condition: service_healthy }
      restate: { condition: service_healthy }
      blob-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/ready').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60

  worker-blue:
    <<: *worker
    environment:
      <<: *app-environment
      PORT: 9080
      HAWA_WORKER_COLOUR: blue
      HAWA_WORKER_SELF_URI: http://worker-blue:9080
      HAWA_CHAOS_SERVICE: worker-blue

  worker-green:
    <<: *worker
    # Started only for a deploy scenario; blue is the live colour.
    profiles: ["green"]
    environment:
      <<: *app-environment
      PORT: 9080
      HAWA_WORKER_COLOUR: green
      HAWA_WORKER_SELF_URI: http://worker-green:9080
      HAWA_CHAOS_SERVICE: worker-green

  # Explicit full-app rehearsal profile. These use production images/configuration,
  # synthetic office data, and the existing isolated project; never office credentials.
  docling:
    profiles: [candidate]
    build: ../../../services/docling
    image: hawa-chaos-docling:local
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 32
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    networks: [parser]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30

  desk:
    profiles: [candidate]
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile.desk
      args:
        HAWA_BUILD_COMMIT: ${CHAOS_BUILD_COMMIT:-unknown}
    image: hawa-chaos-desk:local
    restart: "no"
    mem_limit: 128m
    networks: [chaos]

  nginx:
    profiles: [candidate]
    image: nginx:1.27-alpine-slim
    restart: "no"
    mem_limit: 128m
    ports: ["127.0.0.1:56081:80"]
    volumes:
      - ../../../infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - chaos_blobs:/srv/hawa-blobs:ro
    networks: [chaos, chaos-edge]
    depends_on:
      core: {condition: service_healthy}
      desk: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  chaos:
    internal: true
  chaos-edge: {}
  parser:
    internal: true

volumes:
  chaos_postgres: {}
  chaos_restate: {}
  chaos_ca: {}
  chaos_blobs: {}
