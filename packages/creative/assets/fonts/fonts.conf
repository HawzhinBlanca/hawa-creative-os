<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- For fc-* tools run by hand. The renderer does not read this file: every rsvg-convert call gets
       a generated one that lists only this folder and the Verdana files (font-environment.ts). -->
  <dir prefix="relative">.</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- Web subsets share the family names with fewer glyphs; fontkit never measures them. -->
  <selectfont><rejectfont><glob>*.woff2</glob><glob>*.woff</glob></rejectfont></selectfont>
</fontconfig>
