<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The core image points FONTCONFIG_FILE here, so fc-* tools run by hand and anything in the
       process that rasterises text without the renderer's environment see what the renderer sees.
       The renderer itself does not read this file: every rsvg-convert call gets a generated one
       (font-environment.ts) listing the same set with absolute paths. That set is this folder plus
       the Verdana faces render-fonts.json names, which may not be redistributed and so stay in the
       system folders; everything else in those folders is rejected. -->
  <dir prefix="relative">.</dir>
  <dir>/usr/share/fonts/truetype/msttcorefonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <selectfont>
    <rejectfont>
      <!-- Web subsets share the family names with fewer glyphs; fontkit never measures them. -->
      <glob>*.woff2</glob>
      <glob>*.woff</glob>
      <glob>/usr/share/fonts/truetype/msttcorefonts/*</glob>
      <glob>/System/Library/Fonts/Supplemental/*</glob>
    </rejectfont>
    <acceptfont>
      <glob>/usr/share/fonts/truetype/msttcorefonts/Verdana*.ttf</glob>
      <glob>/System/Library/Fonts/Supplemental/Verdana*.ttf</glob>
    </acceptfont>
  </selectfont>
  <!-- A symbol a Latin face lacks comes from the symbol faces first, as in the generated config
       (SYMBOL_FALLBACK_FAMILY in font-environment.ts; font-pinning-symbols.test.ts checks the list). -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Cinzel</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Hawa Symbols</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Crimson Pro</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Hawa Symbols</string></edit>
  </match>
  <!-- ADR-275: Inter's ExtraBold (800) and Black (900) files are in this folder and are matched as
       family "Inter" at weights 205 and 210; render-fonts.json declares them, and a block drawn at
       font-weight 800 or 900 opens the same file fontkit measured it with. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Inter</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Hawa Symbols</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Playfair Display</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Hawa Symbols</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Plus Jakarta Sans</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Hawa Symbols</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Verdana</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Hawa Symbols</string></edit>
  </match>
</fontconfig>
