<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="aster-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00875A"/>
      <stop offset="100%" stop-color="#0B2117"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect x="5" y="5" width="390" height="110" rx="20" fill="url(#aster-grad)" stroke="#00A3BF" stroke-width="2"/>
  <!-- Pharmacy Cross & Heart Icon -->
  <circle cx="60" cy="60" r="34" fill="#FFFFFF" opacity="0.15"/>
  <rect x="53" y="42" width="14" height="36" rx="4" fill="#FFFFFF"/>
  <rect x="42" y="53" width="36" height="14" rx="4" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="6" fill="#00875A"/>
  <!-- Typography Latin -->
  <text x="115" y="55" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="1">ASTER PHARMACY</text>
  <!-- Kurdish Sorani Typography with UAX #9 First-Strong Isolation -->
  <text x="115" y="86" font-family="'Noto Sans Arabic', Vazirmatn, sans-serif" font-size="17" font-weight="700" fill="#E0F2FE">&#x2067;دەرمانخانەی ئاستەر · هەولێر&#x2069;</text>
  <!-- 24/7 Care Pill -->
  <rect x="300" y="32" width="80" height="24" rx="12" fill="#00A3BF"/>
  <text x="340" y="48" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">24/7 CARE</text>
</svg>
