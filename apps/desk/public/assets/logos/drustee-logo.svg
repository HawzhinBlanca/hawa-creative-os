<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="drustee-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D5C3A"/>
      <stop offset="100%" stop-color="#062E1D"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect x="5" y="5" width="390" height="110" rx="20" fill="url(#drustee-grad)" stroke="#D4AF37" stroke-width="2"/>
  <!-- Botanical Emblem -->
  <circle cx="60" cy="60" r="32" fill="#D4AF37" opacity="0.18"/>
  <circle cx="60" cy="60" r="26" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M60 42 C68 46, 72 56, 60 76 C48 56, 52 46, 60 42 Z" fill="#D4AF37"/>
  <!-- Typography Latin -->
  <text x="115" y="54" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">DRUSTEE</text>
  <!-- Kurdish Sorani Typography with UAX #9 First-Strong Isolation -->
  <text x="115" y="86" font-family="Vazirmatn, system-ui, sans-serif" font-size="17" font-weight="700" fill="#E8D288">&#x2067;دروستی · بەڵگەی زانستی لە پێشینەیە&#x2069;</text>
  <!-- Lab Verified Seal -->
  <rect x="290" y="32" width="92" height="24" rx="12" fill="#D4AF37"/>
  <text x="336" y="48" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#062E1D" text-anchor="middle">LAB VERIFIED</text>
</svg>
