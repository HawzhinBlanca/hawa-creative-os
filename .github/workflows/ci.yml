name: Hawa Creative OS — Continuous Assurance CI/CD

# Every job here must be able to go red. Until 2026-09-27 no step of this workflow had ever run
# (60 of 60 runs died before a runner was assigned), and the test job had no database, no Verdana
# and no rsvg, so it could not have passed on a clean runner either: 146 of 430 test files failed
# on a fresh Linux checkout. See output/audits/2026-09-27-hawdesign-audit/REPORT.md.
# By 2026-10-02 it passed 9 of 100 runs, every failure a Mac-vs-clean-runner difference (a doc link into
# git-ignored output/, host-generated env files, no ffmpeg, no nginx image). ADR-281 closed them so that
# a local `validate_pack.py` and a clean runner give the same verdict.

on:
  push:
    branches: [master, main, studio-v2, codex/research-grade-design-system]
  pull_request:
    branches: [master, main, studio-v2, codex/research-grade-design-system]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  blueprint-and-security:
    name: Blueprint & Security Hygiene (Gates A, B)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Gate A — Master Blueprint Validation
        run: python3 scripts/validate_pack.py

      - name: Gate B — Secret scan of the tracked tree (not history)
        run: |
          python3 infra/security/security_scan.py --self-test
          python3 infra/security/security_scan.py

  typecheck-and-tests:
    name: Typecheck, Lint & Test Suite on PostgreSQL (Gates C–P)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway credentials for the service container below, which exists only for this job on
      # this runner. The same two values are in services.postgres (a service cannot read env).
      HAWA_TEST_POSTGRES_PASSWORD: ci-throwaway-owner
      HAWA_TEST_APP_PASSWORD: ci-throwaway-app
    services:
      postgres:
        # The production image (infra/docker/docker-compose.prod.yml), on the test port the suite's
        # guard accepts (127.0.0.1:55432; production's 54332 is refused).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hawa_owner
          POSTGRES_PASSWORD: ci-throwaway-owner
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hawa_owner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # Full history, and the PR's own head rather than GitHub's merge commit: the release-manifest
      # test (packages/testkit/test/r11-release-gate.test.ts) checks that RELEASE_MANIFEST.json
      # records HEAD or one of its two parents, and that the recorded commit exists.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      # Also the Pango/Cairo headers `pnpm test` needs to compile the shared text-measurement helper
      # (packages/creative/native, ADR-118); the runner's own Pango runtime draws the text.
      - name: Install render dependencies (rsvg, Verdana, ImageMagick, Pango headers, ffmpeg, heif-convert)
        run: bash scripts/ci/install_render_deps.sh

      # The nginx tests run infra/docker/nginx.conf in the production image with `docker run
      # --pull=never`, so a test never downloads on its own. A fresh runner has no images: the
      # pinned-image validation in packages/testkit/test/chaos-service-boundaries.test.ts failed
      # (exit 125) and four other nginx suites skipped. Pull the tag compose pins (ADR-281).
      - name: Pull the production nginx image the nginx tests run
        run: |
          image=$(sed -n 's/^ *image: \(nginx:[^ ]*\)$/\1/p' infra/docker/docker-compose.prod.yml)
          test -n "$image" || { echo "no nginx image in docker-compose.prod.yml"; exit 1; }
          docker pull "$image"

      - name: Gate C — Strict TypeScript build (builds every package's dist/)
        run: pnpm typecheck

      - name: Lint (scripts typecheck, any-ratchet, provider egress, ADR and migration numbers)
        run: pnpm lint

      - name: Provision the test databases (hawa_test, hawa_repair)
        run: |
          pnpm test:db --external-server
          pnpm -s test:db --print-env >> "$GITHUB_ENV"

      - name: Gate J — Live schema parity against the provisioned database
        run: DATABASE_URL="$TEST_DATABASE_OWNER_URL" pnpm db:check

      - name: Gate H — Desk PWA production build (a test checks its bundle size)
        run: pnpm --filter @hawa/desk build

      - name: Gates D–P — Full Vitest suite
        run: |
          test -n "$TEST_DATABASE_URL" -a -n "$HAWA_ISOLATED_TEST_DB" || { echo "database env missing: the DB suites would skip"; exit 1; }
          pnpm test

      - name: The suite left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Tests wrote into the repository:"; git status --porcelain; exit 1
          fi

  evals-and-supply-chain:
    name: Eval Harness, SBOM & Container Topology (Gates Q, S)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` starts with build:native, which compiles the Pango text-measurement helper.
      - name: Install the native build dependencies (Pango headers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config libpango1.0-dev

      - name: Build the workspace packages (the eval runner imports their dist/)
        run: pnpm build

      # This runs against the fake gateway and its own expected answers, so it cannot fail on
      # model quality (audit LLM-01/02). It is kept as a smoke test that the harness still runs.
      - name: Eval harness smoke (fake gateway; not a quality gate)
        run: pnpm eval

      - name: Gate Q — CycloneDX SBOM from the lockfile
        run: pnpm dlx pnpm@11 sbom --sbom-format cyclonedx --lockfile-only > "$RUNNER_TEMP/sbom.json"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.json

      # Core and the workers read host-generated files (.env.service-boundaries, .env.worker) that are
      # never committed: deploy.sh writes them with infra/ops/prepare_service_boundaries.py (ADR-163).
      # Generate them here the same way, from the example files, with throwaway values that live only
      # on this runner, and validate every profile, the workers included (ADR-281).
      - name: Gate S — Validate Docker Compose topology
        run: |
          cp infra/docker/.env.production.example infra/docker/.env.production
          cp infra/docker/.env.example infra/docker/.env
          python3 infra/ops/prepare_service_boundaries.py --directory infra/docker
          docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env.example --profile '*' config --quiet
          echo "Docker Compose declarative topology valid."
